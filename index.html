function categorize(desc) {
  if (!desc) return "";
  const d = desc.toLowerCase();
  if (d.includes("paliwo")) return "Paliwo";
  if (["płyn", "plyn", "swiffer", "wkład", "wklad", "szmat", "ręcznik", "recznik"].some((k) => d.includes(k))) return "Chemia i materiały";
  if (d.includes("myjka") || d.includes("sprzęt") || d.includes("sprzet")) return "Sprzęt";
  if (d.includes("ulotk") || d.includes("marketing")) return "Marketing";
  return "Inne";
}
function classifyClient(name) {
  if (!name) return "";
  const n = name.toLowerCase();
  if (n.includes("sp. z o") || n.includes("sp.zoo") || n.includes("s.c.") || n.includes("firma")) return "Firma";
  return "Osoba prywatna";
}
function fmtPLN(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return new Intl.NumberFormat("pl-PL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v) + " zł";
}
function fmtNum(v, suffix = "") {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return new Intl.NumberFormat("pl-PL", { maximumFractionDigits: 1 }).format(v) + suffix;
}
function weekdayName(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const idx = (d.getDay() + 6) % 7;
  return ["poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota", "niedziela"][idx];
}
function isWeekend(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  return day === 0 || day === 6;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function defaultOrderStatus(dateStr) {
  if (!dateStr) return "Wykonane";
  return dateStr > todayStr() ? "Zaplanowane" : "Wykonane";
}
function isRealized(e) {
  return e.statusZlecenia !== "Zaplanowane" && e.statusZlecenia !== "Odwołane";
}
function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + (m || 0);
}
function fmtTimeRange(start, hours) {
  const startMin = timeToMinutes(start);
  const dur = (Number(hours) || 1) * 60;
  const endMin = startMin + dur;
  const fmt = (min) => `${String(Math.floor((min % 1440) / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
  return `${fmt(startMin)}–${fmt(endMin)}`;
}
function findConflict(entries, payload, excludeId) {
  if (!payload.godzinaStart || !payload.data) return null;
  const startA = timeToMinutes(payload.godzinaStart);
  const endA = startA + (Number(payload.godziny) || 1) * 60;
  for (const e of entries) {
    if (e.id === excludeId) continue;
    if (e.data !== payload.data) continue;
    if (!e.godzinaStart) continue;
    if (e.statusZlecenia === "Odwołane") continue;
    const startB = timeToMinutes(e.godzinaStart);
    const endB = startB + (Number(e.godziny) || 1) * 60;
    if (startA < endB && startB < endA) return e;
  }
  return null;
}

// Sorts by date, then by time of day (entries without a time come after those with one,
// on the same date), then by id as a final stable tiebreaker.
function compareEntries(a, b) {
  if (a.data !== b.data) return a.data < b.data ? -1 : 1;
  const at = a.godzinaStart, bt = b.godzinaStart;
  if (at && bt && at !== bt) return at < bt ? -1 : 1;
  if (at && !bt) return -1;
  if (!at && bt) return 1;
  return a.id - b.id;
}

// One-time migration helper: builds an explicit client list from historical entries
// (used the first time the app runs, before a real "clients" list exists yet).
function deriveClientsFromEntries(entries) {
  const map = {};
  const order = [];
  (entries || [])
    .filter((e) => e.klient && e.klient.trim())
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""))
    .forEach((e) => {
      if (!map[e.klient]) order.push(e.klient);
      map[e.klient] = { name: e.klient, adres: e.adres || "", typKlienta: e.typKlienta || "", telefon: "", uwagi: "" };
    });
  return order.map((name, i) => ({ id: Date.now() + i, ...map[name] }));
}

          const rawFree = localStorage.getItem(STORAGE_KEY_FREE);
          setFreeDays(rawFree ? JSON.parse(rawFree) : []);
          const rawClients = localStorage.getItem(STORAGE_KEY_CLIENTS);
          setClients(rawClients ? JSON.parse(rawClients) : deriveClientsFromEntries(loadedEntries));
        } catch (e) {
          setEntries(SEED_ENTRIES);
        }
      }
    );
    return () => unsub();
  }, []);

  // Explicit sync — called only from user-initiated mutations below, never from the
  // Firestore listener itself. This is what prevents a device that just loaded a
  // (possibly momentarily stale) snapshot from echoing it back and clobbering a
  // newer write made from another device in the meantime.
  function syncToFirestore(nextEntries, nextFreeDays, nextClients) {
    const clientsToSave = nextClients !== undefined ? nextClients : clients;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nextEntries));
      localStorage.setItem(STORAGE_KEY_FREE, JSON.stringify(nextFreeDays));
      localStorage.setItem(STORAGE_KEY_CLIENTS, JSON.stringify(clientsToSave));
    } catch (e) {}
    if (window.firebaseDb) {
      setSaveState("saving");
      const docRef = window.firebaseDb.collection("app-data").doc("entries");
      docRef.set({ items: nextEntries, freeDays: nextFreeDays, clients: clientsToSave })
        .then(() => setSaveState("saved"))
        .catch(() => setSaveState("error"));
      // Automatyczna, codzienna kopia zapasowa — działa w tle, bez żadnej akcji użytkownika.
      // Nadpisuje się przez cały dzień (zawsze trzyma najnowszy stan z danego dnia), a od
      // północy zaczyna nowy, osobny dokument — więc z czasem powstaje historia dzień po dniu,
      // z której można w razie czego przywrócić dane sprzed awarii czy pomyłki.
      try {
        const todayKey = todayStr();
        docRef.collection("backups").doc(todayKey).set({
          items: nextEntries, freeDays: nextFreeDays, clients: clientsToSave,
          savedAt: Date.now(),
        }).catch(() => {});
      } catch (e) {}
    }
  }

  function exportBackupFile() {
    const payload = {
      exportedAt: new Date().toISOString(),
      items: entries, freeDays, clients,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `szczotka-i-zmiotka-kopia-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function loadBackupsList() {
    if (!window.firebaseDb) return;
    setBackupsLoading(true);
    window.firebaseDb.collection("app-data").doc("entries").collection("backups")
      .orderBy(window.firebase.firestore.FieldPath.documentId(), "desc")
      .limit(30)
      .get()
      .then((snap) => {
        const list = [];
        snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
        setBackupsList(list);
        setBackupsLoading(false);
      })
      .catch(() => setBackupsLoading(false));
  }

  function restoreBackup(backup) {
    const nextEntries = backup.items || [];
    const nextFree = backup.freeDays || [];
    const nextClients = backup.clients || [];
    setEntries(nextEntries);
    setFreeDays(nextFree);
    setClients(nextClients);
    syncToFirestore(nextEntries, nextFree, nextClients);
    setConfirmRestoreBackup(null);
    setShowBackupsPanel(false);
  }


  const isYearSearch = search.trim() !== "" && searchScope === "year";

  const monthEntries = useMemo(() => {
    if (!entries) return [];
    const base = isYearSearch
      ? entries.filter((e) => e.data && new Date(e.data + "T00:00:00").getFullYear() === year)
      : entries.filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === activeTab && new Date(e.data + "T00:00:00").getFullYear() === year);
    return base
      .sort(compareEntries)
      .filter((e) => {
        if (!search.trim()) return true;
        const s = search.toLowerCase();
        return (e.klient || "").toLowerCase().includes(s) || (e.adres || "").toLowerCase().includes(s);
      });
  }, [entries, activeTab, year, search, isYearSearch]);

  const monthSummary = useMemo(() => {
    const all = (entries || []).filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === activeTab && new Date(e.data + "T00:00:00").getFullYear() === year);
    const done = all.filter(isRealized);
    const godziny = done.reduce((s, e) => s + (Number(e.godziny) || 0), 0);
    const zarobki = done.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    const wydatki = done.reduce((s, e) => s + (Number(e.wydatki) || 0), 0);
    const liczbaZlecen = done.filter((e) => e.klient && e.klient.trim()).length;
    const planned = all.filter((e) => e.statusZlecenia === "Zaplanowane");
    const zaplanowaneZarobki = planned.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    return {
      godziny, zarobki, wydatki, zysk: zarobki - wydatki, liczbaZlecen,
      stawka: godziny > 0 ? zarobki / godziny : 0,
      zaplanowaneLiczba: planned.length, zaplanowaneZarobki,
    };
  }, [entries, activeTab, year]);

  const monthDetailLists = useMemo(() => {
    const all = (entries || []).filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === activeTab && new Date(e.data + "T00:00:00").getFullYear() === year);
    const zarobki = all.filter((e) => isRealized(e) && Number(e.zarobki) > 0).sort(compareEntries);
    const wydatki = all.filter((e) => Number(e.wydatki) > 0).sort(compareEntries);
    const zaplanowane = all.filter((e) => e.statusZlecenia === "Zaplanowane").sort(compareEntries);
    return { zarobki, wydatki, zaplanowane };
  }, [entries, activeTab, year]);

  const knownClients = useMemo(() => {
    const alphabetical = clients.slice().sort((a, b) => a.name.localeCompare(b.name, "pl"));
    const byName = {};
    clients.forEach((c) => { byName[c.name] = c; });
    const seen = new Set();
    const order = [];
    (entries || [])
      .filter((e) => e.klient && e.klient.trim())
      .sort((a, b) => (a.data || "").localeCompare(b.data || ""))
      .forEach((e) => {
        if (!seen.has(e.klient)) { seen.add(e.klient); order.push(e.klient); }
      });
    const recent = order.slice().reverse().map((name) => byName[name] || { name, adres: "", typKlienta: "" }).slice(0, 8);
    return { list: alphabetical, recent };
  }, [clients, entries]);

  function computeClientsAfterEntry(prevClients, name, adres, typKlienta) {
    if (!name || !name.trim()) return prevClients;
    const exists = prevClients.find((c) => c.name === name);
    if (exists) {
      return prevClients.map((c) => (c.name === name ? { ...c, adres: adres || c.adres, typKlienta: typKlienta || c.typKlienta } : c));
    }
    return [...prevClients, { id: Date.now() + Math.random(), name: name.trim(), adres: adres || "", typKlienta: typKlienta || "", telefon: "", uwagi: "" }];
  }

  const yearData = useMemo(() => {
    const months = MONTH_NAMES.map((name, idx) => {
      const all = (entries || []).filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === idx && new Date(e.data + "T00:00:00").getFullYear() === year).filter(isRealized);
      const godziny = all.reduce((s, e) => s + (Number(e.godziny) || 0), 0);
      const zarobki = all.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
      const wydatki = all.reduce((s, e) => s + (Number(e.wydatki) || 0), 0);
      const liczbaZlecen = all.filter((e) => e.klient && e.klient.trim()).length;
      const zysk = zarobki - wydatki;
      return { name, godziny, zarobki, wydatki, zysk, liczbaZlecen, stawka: godziny > 0 ? zarobki / godziny : 0, marza: zarobki > 0 ? zysk / zarobki : 0 };
    });
    let cum = 0;
    const withCum = months.map((m) => { cum += m.zysk; return { ...m, skumulowany: cum }; });

    const totalZarobki = months.reduce((s, m) => s + m.zarobki, 0);
    const totalWydatki = months.reduce((s, m) => s + m.wydatki, 0);
    const totalGodziny = months.reduce((s, m) => s + m.godziny, 0);
    const totalZlecenia = months.reduce((s, m) => s + m.liczbaZlecen, 0);

    const inYear = (e) => e.data && new Date(e.data + "T00:00:00").getFullYear() === year;

    const catMap = {};
    (entries || []).filter(isRealized).filter(inYear).forEach((e) => {
      if (Number(e.wydatki) > 0) {
        const cat = e.kategoria || "Inne";
        catMap[cat] = (catMap[cat] || 0) + Number(e.wydatki);
      }
    });
    const categories = CATEGORIES.map((c) => ({ name: c, value: Math.round((catMap[c] || 0) * 100) / 100 })).filter((c) => c.value > 0);

    const clientMap = {};
    (entries || []).filter(isRealized).filter(inYear).forEach((e) => {
      if (e.klient && e.klient.trim()) {
        if (!clientMap[e.klient]) clientMap[e.klient] = { klient: e.klient, zarobki: 0, liczba: 0 };
        clientMap[e.klient].zarobki += Number(e.zarobki) || 0;
        clientMap[e.klient].liczba += 1;
      }
    });
    const topClients = Object.values(clientMap).sort((a, b) => b.zarobki - a.zarobki).slice(0, 10);

    const plannedAll = (entries || []).filter((e) => e.statusZlecenia === "Zaplanowane").filter(inYear);
    const zaplanowaneZarobki = plannedAll.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);

    return {
      months: withCum, totalZarobki, totalWydatki, totalGodziny, totalZlecenia,
      totalZysk: totalZarobki - totalWydatki,
      marza: totalZarobki > 0 ? (totalZarobki - totalWydatki) / totalZarobki : 0,
      stawka: totalGodziny > 0 ? totalZarobki / totalGodziny : 0,
      categories, topClients,
      zaplanowaneLiczba: plannedAll.length, zaplanowaneZarobki,
    };
  }, [entries, year]);

  const upcomingData = useMemo(() => {
    const all = entries || [];
    const today = todayStr();
    const planned = all.filter((e) => e.statusZlecenia === "Zaplanowane" && e.data);
    const overdue = planned.filter((e) => e.data < today).sort(compareEntries);
    const upcoming = planned.filter((e) => e.data >= today).sort(compareEntries);
    const zarobkiPlanowane = planned.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    const next7 = upcoming.filter((e) => {
      const d = new Date(e.data + "T00:00:00");
      const t = new Date(today + "T00:00:00");
      const diff = (d - t) / (1000 * 60 * 60 * 24);
      return diff <= 7;
    });
    return { overdue, upcoming, zarobkiPlanowane, liczba: planned.length, next7count: next7.length };
  }, [entries]);

  const calendarCells = useMemo(() => {
    const first = new Date(year, activeTab, 1);
    const daysInMonth = new Date(year, activeTab + 1, 0).getDate();
    const startOffset = (first.getDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(activeTab + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayEntries = monthEntriesForCalendar(entries, dateStr);
      const freeDay = freeDays.find((f) => f.date === dateStr) || null;
      cells.push({ day: d, dateStr, entries: dayEntries, freeDay });
    }
    return cells;
  }, [entries, activeTab, year, freeDays]);

  function monthEntriesForCalendar(entries, dateStr) {
    return (entries || []).filter((e) => e.data === dateStr);
  }

  const openAddClientForm = useCallback((dateStr) => {
    setEditingId(null);
    setFormType("klient");
    const d = dateStr || `${year}-${String(activeTab + 1).padStart(2, "0")}-01`;
    setForm({ ...emptyForm, data: d, statusZlecenia: defaultOrderStatus(d) });
    setShowForm(true);
  }, [activeTab, year]);

  const openAddPurchaseForm = useCallback((dateStr) => {
    setEditingId(null);
    setFormType("zakup");
    const d = dateStr || `${year}-${String(activeTab + 1).padStart(2, "0")}-01`;
    setForm({ ...emptyForm, data: d, opisUslugi: "", statusZlecenia: "Wykonane" });
    setShowForm(true);
  }, [activeTab, year]);

  const openAddOrderForClient = useCallback((client) => {
    setEditingId(null);
    setFormType("klient");
    const d = todayStr();
    setForm({
      ...emptyForm, data: d, statusZlecenia: defaultOrderStatus(d),
      klient: client.name, adres: client.adres || "", typKlienta: client.typKlienta || "",
    });
    setShowForm(true);
  }, []);

  const openEditForm = useCallback((entry) => {
    setEditingId(entry.id);
    const hasKlient = !!(entry.klient && entry.klient.trim());
    const hasZakup = (entry.wydatki !== null && entry.wydatki !== undefined && entry.wydatki !== "") || !!(entry.opisWydatkow && entry.opisWydatkow.trim());
    let detectedType = "full";
    if (hasKlient && !hasZakup) detectedType = "klient";
    else if (hasZakup && !hasKlient) detectedType = "zakup";
    else if (!hasKlient && !hasZakup) detectedType = "klient";
    setFormType(detectedType);
    setForm({
      data: entry.data || "", godzinaStart: entry.godzinaStart || "", klient: entry.klient || "", adres: entry.adres || "",
      opisUslugi: entry.opisUslugi || "", godziny: entry.godziny ?? "", zarobki: entry.zarobki ?? "",
      wydatki: entry.wydatki ?? "", opisWydatkow: entry.opisWydatkow || "", kategoria: entry.kategoria || "",
      typKlienta: entry.typKlienta || "", status: entry.status || "", uwagi: entry.uwagi || "",
      statusZlecenia: entry.statusZlecenia || defaultOrderStatus(entry.data),
    });
    setShowForm(true);
  }, []);

  function handleFormChange(field, value) {
    setForm((f) => {
      const next = { ...f, [field]: value };
      if (field === "opisWydatkow" && !f.kategoria) {
        next.kategoria = categorize(value);
      }
      if (field === "klient") {
        const known = knownClients.list.find((c) => c.name === value);
        if (known) {
          if (!f.adres) next.adres = known.adres;
          if (known.typKlienta) next.typKlienta = known.typKlienta;
        } else if (!f.typKlienta) {
          next.typKlienta = classifyClient(value);
        }
      }
      return next;
    });
  }

  function buildPayload() {
    const payload = {
      data: form.data, godzinaStart: form.godzinaStart, klient: form.klient.trim(), adres: form.adres.trim(),
      opisUslugi: form.opisUslugi.trim(), godziny: form.godziny === "" ? null : Number(form.godziny),
      zarobki: form.zarobki === "" ? null : Number(form.zarobki),
      wydatki: form.wydatki === "" ? null : Number(form.wydatki),
      opisWydatkow: form.opisWydatkow.trim(), kategoria: form.kategoria, typKlienta: form.typKlienta,
      status: form.status, uwagi: form.uwagi.trim(),
      statusZlecenia: form.statusZlecenia || defaultOrderStatus(form.data),
    };
    if (formType === "klient") {
      payload.wydatki = null; payload.opisWydatkow = ""; payload.kategoria = "";
    } else if (formType === "zakup") {
      payload.klient = ""; payload.adres = ""; payload.opisUslugi = ""; payload.godziny = null;
      payload.godzinaStart = ""; payload.zarobki = null; payload.typKlienta = ""; payload.status = ""; payload.statusZlecenia = "Wykonane";
    }
    return payload;
  }

  function commitPayload(payload) {
    let next;
    if (editingId) {
      next = entries.map((e) => (e.id === editingId ? { ...payload, id: editingId } : e));
    } else {
      const nextId = entries.length ? Math.max(...entries.map((e) => e.id)) + 1 : 1;
      next = [...entries, { ...payload, id: nextId }];
    }
    let nextClients = clients;
    if (payload.klient && payload.klient.trim()) {
      const exists = clients.find((c) => c.name === payload.klient);
      if (exists || form.saveClientToList) {
        nextClients = computeClientsAfterEntry(clients, payload.klient, payload.adres, payload.typKlienta);
      }
    }
    setEntries(next);
    if (nextClients !== clients) setClients(nextClients);
    syncToFirestore(next, freeDays, nextClients);
    setShowForm(false);
  }

  function saveEntry() {
    if (!form.data) return;
    const payload = buildPayload();
    const freeDayHit = (formType === "klient" || formType === "full") ? freeDays.find((d) => d.date === payload.data) : null;
    if (freeDayHit) {
      setConflictInfo({ payload, type: "freeday", freeDay: freeDayHit });
      return;
    }
    if (payload.godzinaStart) {
      const conflict = findConflict(entries, payload, editingId);
      if (conflict) {
        setConflictInfo({ payload, type: "time", conflict });
        return;
      }
    }
    commitPayload(payload);
  }

  function deleteEntry(id) {
    const next = entries.filter((e) => e.id !== id);
    setEntries(next);
    syncToFirestore(next, freeDays);
  }

  function setEntryStatus(id, status) {
    const next = entries.map((e) => (e.id === id ? { ...e, statusZlecenia: status } : e));
    setEntries(next);
    syncToFirestore(next, freeDays);
  }

  function openMove(entry) {
    setMoveInfo({ id: entry.id, klient: entry.klient, opisWydatkow: entry.opisWydatkow, newDate: entry.data, newTime: entry.godzinaStart || "" });
  }

  function performMove(force) {
    if (!moveInfo) return;
    const original = entries.find((e) => e.id === moveInfo.id);
    if (!original) { setMoveInfo(null); return; }
    const payload = { ...original, data: moveInfo.newDate, godzinaStart: moveInfo.newTime };
    if (!force && payload.godzinaStart) {
      const conflict = findConflict(entries, payload, moveInfo.id);
      if (conflict) {
        setMoveConflict({ conflict });
        return;
      }
    }
    const next = entries.map((e) => (e.id === moveInfo.id ? { ...e, data: moveInfo.newDate, godzinaStart: moveInfo.newTime } : e));
    setEntries(next);
    syncToFirestore(next, freeDays);
    setMoveInfo(null);
    setMoveConflict(null);
  }

  function openFreeDayForm(dateStr) {
    setFreeDayForm({ start: dateStr || "", end: dateStr || "", opis: "" });
    setFreeDayConflict(null);
    setShowFreeDayForm(true);
  }

  function saveFreeDays(force) {
    if (!freeDayForm.start) return;
    const start = freeDayForm.start;
    const end = freeDayForm.end || freeDayForm.start;
    const startD = new Date(start + "T00:00:00");
    const endD = new Date(end + "T00:00:00");
    const days = [];
    for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
      const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      days.push(ds);
    }
    if (!force) {
      const dSet = new Set(days);
      const conflicts = entries.filter((e) => e.klient && e.klient.trim() && e.statusZlecenia !== "Odwołane" && dSet.has(e.data));
      if (conflicts.length > 0) {
        setFreeDayConflict({ days, conflicts });
        return;
      }
    }
    commitFreeDays(days);
  }

  function commitFreeDays(days) {
    const existing = new Set(freeDays.map((f) => f.date));
    const next = [...freeDays];
    days.forEach((ds) => {
      if (!existing.has(ds)) {
        next.push({ id: Date.now() + Math.random(), date: ds, opis: freeDayForm.opis.trim() });
      }
    });
    setFreeDays(next);
    syncToFirestore(entries, next);
    setShowFreeDayForm(false);
    setFreeDayConflict(null);
  }

  function removeFreeDay(id) {
    const next = freeDays.filter((d) => d.id !== id);
    setFreeDays(next);
    syncToFirestore(entries, next);
  }

  function openAddClientRecord() {
    setEditingClientId(null);
    setClientForm({ name: "", adres: "", telefon: "", typKlienta: "", uwagi: "" });
    setShowClientForm(true);
  }

  function openEditClientRecord(client) {
    setEditingClientId(client.id);
    setClientForm({ name: client.name || "", adres: client.adres || "", telefon: client.telefon || "", typKlienta: client.typKlienta || "", uwagi: client.uwagi || "" });
    setShowClientForm(true);
  }

  function saveClientRecord() {
    if (!clientForm.name.trim()) return;
    let next;
    if (editingClientId) {
      next = clients.map((c) => (c.id === editingClientId ? { ...c, ...clientForm, name: clientForm.name.trim() } : c));
    } else {
      next = [...clients, { id: Date.now() + Math.random(), ...clientForm, name: clientForm.name.trim() }];
    }
    setClients(next);
    syncToFirestore(entries, freeDays, next);
    setShowClientForm(false);
  }

  function deleteClientRecord(id) {
    const next = clients.filter((c) => c.id !== id);
    setClients(next);
    syncToFirestore(entries, freeDays, next);
  }

  if (entries === null) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: BG }}>
        <div className="flex items-center gap-2 text-sm" style={{ color: INK, fontFamily: BODY_FONT }}>
          <Sparkles size={16} className="animate-pulse" /> Wczytywanie rejestru…
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ background: BG, fontFamily: BODY_FONT, color: INK }}>
      <FontImport />
      <Header
        saveState={saveState}
        onBackups={() => { setShowBackupsPanel(true); loadBackupsList(); }}
        year={year}
        onYearChange={setYear}
      />

      <TabBar
        activeTab={activeTab}
        view={view}
        onSelectMonth={(i) => { setActiveTab(i); setView("month"); }}
        yearData={yearData}
      />

      <ActionBar
        view={view}
        upcomingCount={upcomingData.upcoming.length + upcomingData.overdue.length}
        onAddClient={() => openAddClientForm()}
        onAddPurchase={() => openAddPurchaseForm()}
        onAddFreeDay={() => openFreeDayForm()}
        onGoUpcoming={() => setView("upcoming")}
        onGoSummary={() => setView("summary")}
        onGoClients={() => setView("clients")}
      />

      <main className="max-w-6xl mx-auto px-4 sm:px-6 pb-24 pt-4">
        {view === "month" && (
          <MonthView
            monthName={MONTH_NAMES[activeTab]}
            year={year}
            summary={monthSummary}
            detailLists={monthDetailLists}
            entries={monthEntries}
            calendarCells={calendarCells}
            freeDays={freeDays.filter((d) => d.date.startsWith(`${year}-${String(activeTab + 1).padStart(2, "0")}`))}
            search={search}
            setSearch={setSearch}
            searchScope={searchScope}
            setSearchScope={setSearchScope}
            isYearSearch={isYearSearch}
            onAddForDay={(dateStr) => openAddClientForm(dateStr)}
            onEdit={openEditForm}
            onDelete={deleteEntry}
            onJumpToMonth={(monthIdx) => { setActiveTab(monthIdx); setSearch(""); }}
            onSetStatus={setEntryStatus}
            onMove={openMove}
            onRemoveFreeDay={removeFreeDay}
            onGoUpcoming={() => setView("upcoming")}
          />
        )}
        {view === "summary" && <SummaryView yearData={yearData} year={year} onGoUpcoming={() => setView("upcoming")} />}
        {view === "upcoming" && (
          <UpcomingView
            data={upcomingData}
            onEdit={openEditForm}
            onDelete={deleteEntry}
            onSetStatus={setEntryStatus}
            onMove={openMove}
            onJumpToMonth={(monthIdx) => { setActiveTab(monthIdx); setView("month"); }}
          />
        )}
        {view === "clients" && (
          <ClientsView
            clients={clients}
            entries={entries}
            search={clientSearch}
            setSearch={setClientSearch}
            onAdd={openAddClientRecord}
            onEdit={openEditClientRecord}
            onDelete={deleteClientRecord}
            onAddOrder={openAddOrderForClient}
          />
        )}
      </main>

      {showForm && !conflictInfo && (
        <EntryFormModal
          form={form}
          isEditing={!!editingId}
          formType={formType}
          knownClients={knownClients}
          onChange={handleFormChange}
          onClose={() => setShowForm(false)}
          onSave={saveEntry}
        />
      )}

      {showBackupsPanel && !confirmRestoreBackup && (
        <BackupsPanel
          backups={backupsList}
          loading={backupsLoading}
          hasFirebase={!!window.firebaseDb}
          onExport={exportBackupFile}
          onRestore={(b) => setConfirmRestoreBackup(b)}
          onClose={() => setShowBackupsPanel(false)}
        />
      )}

      {confirmRestoreBackup && (
        <ConfirmModal
          title="Przywrócić tę kopię zapasową?"
          message={`Obecne dane zostaną zastąpione stanem z kopii z dnia ${confirmRestoreBackup.id.split("-").reverse().join(".")}. Wszystko, co dodałaś/eś od tego dnia, zostanie utracone. Tej operacji nie da się cofnąć.`}
          confirmLabel="Przywróć"
          onConfirm={() => restoreBackup(confirmRestoreBackup)}
          onCancel={() => setConfirmRestoreBackup(null)}
        />
      )}

      {conflictInfo && conflictInfo.type === "time" && (
        <ConfirmModal
          title="Kolizja terminów"
          message={`Ten termin (${fmtTimeRange(conflictInfo.payload.godzinaStart, conflictInfo.payload.godziny)}) nakłada się z wizytą u „${conflictInfo.conflict.klient || "innego klienta"}” (${fmtTimeRange(conflictInfo.conflict.godzinaStart, conflictInfo.conflict.godziny)}) tego samego dnia. Czy mimo to zapisać ten termin?`}
          confirmLabel="Zapisz mimo to"
          onConfirm={() => {
            commitPayload(conflictInfo.payload);
            setConflictInfo(null);
          }}
          onCancel={() => setConflictInfo(null)}
        />
      )}

      {conflictInfo && conflictInfo.type === "freeday" && (
        <ConfirmModal
          title="To dzień wolny"
          message={`${conflictInfo.payload.data.split("-").reverse().join(".")} jest oznaczony jako dzień wolny${conflictInfo.freeDay.opis ? ` („${conflictInfo.freeDay.opis}”)` : ""}. Czy mimo to zaplanować na ten dzień zlecenie?`}
          confirmLabel="Zaplanuj mimo to"
          onConfirm={() => {
            commitPayload(conflictInfo.payload);
            setConflictInfo(null);
          }}
          onCancel={() => setConflictInfo(null)}
        />
      )}

      {moveInfo && !moveConflict && (
        <MoveModal
          moveInfo={moveInfo}
          onChange={(field, value) => setMoveInfo((m) => ({ ...m, [field]: value }))}
          onClose={() => setMoveInfo(null)}
          onSave={() => performMove(false)}
        />
      )}

      {moveConflict && (
        <ConfirmModal
          title="Kolizja terminów"
          message={`Nowy termin (${fmtTimeRange(moveInfo.newTime, entries.find((e) => e.id === moveInfo.id)?.godziny)}) nakłada się z wizytą u „${moveConflict.conflict.klient || "innego klienta"}” (${fmtTimeRange(moveConflict.conflict.godzinaStart, moveConflict.conflict.godziny)}) tego samego dnia. Czy mimo to przenieść ten termin?`}
          confirmLabel="Przenieś mimo to"
          onConfirm={() => performMove(true)}
          onCancel={() => setMoveConflict(null)}
        />
      )}

      {showFreeDayForm && !freeDayConflict && (
        <FreeDayModal
          form={freeDayForm}
          onChange={(field, value) => setFreeDayForm((f) => ({ ...f, [field]: value }))}
          onClose={() => setShowFreeDayForm(false)}
          onSave={() => saveFreeDays(false)}
        />
      )}

      {freeDayConflict && (
        <ConfirmModal
          title="Masz już zaplanowane zlecenia"
          message={`W wybranym zakresie dat masz już ${freeDayConflict.conflicts.length} ${freeDayConflict.conflicts.length === 1 ? "zlecenie" : "zlecenie(a)"}: ${freeDayConflict.conflicts.slice(0, 4).map((e) => `${e.klient} (${e.data.split("-").reverse().join(".")})`).join(", ")}${freeDayConflict.conflicts.length > 4 ? "…" : ""}. Czy mimo to oznaczyć te dni jako wolne?`}
          confirmLabel="Oznacz mimo to"
          onConfirm={() => commitFreeDays(freeDayConflict.days)}
          onCancel={() => setFreeDayConflict(null)}
        />
      )}

      {showClientForm && (
        <ClientFormModal
          form={clientForm}
          isEditing={!!editingClientId}
          onChange={(field, value) => setClientForm((f) => ({ ...f, [field]: value }))}
          onClose={() => setShowClientForm(false)}
          onSave={saveClientRecord}
        />
      )}
    </div>
  );
}

const BG = "#F5F8F6";
const SURFACE = "#FFFFFF";

const PRIMARY_DARK = "#154A3F";
const MINT = "#CFE9DE";
const GOLD = "#C99A2E";
const CORAL = "#E0665A";

function FontImport() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { height: 8px; width: 8px; }
      ::-webkit-scrollbar-thumb { background: #C7D6CF; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      input:focus, select:focus, textarea:focus, button:focus-visible {
        outline: 2px solid ${PRIMARY}; outline-offset: 1px;
      }
    `}</style>
  );
}

/* ------------------------------------------------------------------ */
/* Header + Tabs                                                       */
/* ------------------------------------------------------------------ */
function Header({ saveState, onBackups, year, onYearChange }) {
  return (
    <header className="border-b" style={{ borderColor: LINE_COLOR, background: SURFACE }}>
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <img
            src={LOGO_BANNER}
            alt="Szczotka i Zmiotka — Vanessa Jamrozik"
            className="h-11 sm:h-14 w-auto rounded-lg"
            style={{ display: "block" }}
          />
        </div>
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-1 rounded-lg border" style={{ borderColor: LINE_COLOR }}>
            <button onClick={() => onYearChange(year - 1)} className="p-1.5 rounded-l-lg hover:bg-gray-50 transition" title="Poprzedni rok">
              <ChevronLeft size={15} color="#5B6E67" />
            </button>
            <span style={{ fontFamily: MONO_FONT, fontWeight: 600, color: PRIMARY_DARK, minWidth: 40, textAlign: "center" }}>{year}</span>
            <button onClick={() => onYearChange(year + 1)} className="p-1.5 rounded-r-lg hover:bg-gray-50 transition" title="Następny rok">
              <ChevronRight size={15} color="#5B6E67" />
            </button>
          </div>
          <span className="hidden sm:flex items-center gap-1 text-xs" style={{ color: saveState === "error" ? CORAL : "#5B6E67" }}>
            {saveState === "saved" && <><Check size={13} /> Zapisano</>}
            {saveState === "saving" && "Zapisywanie…"}
            {saveState === "error" && "Błąd zapisu"}
          </span>
          <button
            onClick={onBackups}

      <div className="flex items-center gap-1.5 mb-1.5" style={{ color: "#5B6E67" }}>

function MonthView({ monthName, year, summary, entries, calendarCells, freeDays, detailLists, search, setSearch, searchScope, setSearchScope, isYearSearch, onAddForDay, onEdit, onDelete, onJumpToMonth, onSetStatus, onMove, onRemoveFreeDay, onGoUpcoming }) {

      <div className="flex gap-3 flex-wrap">

        <KpiCard icon={Receipt} label="Wydatki" value={fmtPLN(summary.wydatki)} accent={CORAL} onClick={() => setDetail("wydatki")} />

function CalendarStrip({ cells, onAddForDay }) {
  return (
    <div className="rounded-xl p-4" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      <div className="flex items-center gap-4 mb-3 text-[10px] flex-wrap" style={{ color: "#8CA098" }}>
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm" style={{ background: "rgba(31,110,92,0.55)" }} /> wykonane</span>
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm border" style={{ borderColor: "#2A5C8A", borderStyle: "dashed", background: "#EAF1F8" }} /> zaplanowane</span>
        <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full" style={{ background: CORAL }} /> wydatek</span>
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm" style={{ background: "#FDF6E9", border: "1px solid #EED9A8" }} /> wolne</span>
      </div>
      <div className="grid grid-cols-7 gap-1.5 mb-1.5">
        {WEEKDAY_LETTERS.map((w) => (
          <div key={w} className="text-center text-[10px] font-semibold uppercase tracking-wide" style={{ color: "#8CA098" }}>{w}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1.5">
        {cells.map((cell, idx) => {
          if (!cell) return <div key={idx} />;
          const activeEntries = cell.entries.filter((e) => e.statusZlecenia !== "Odwołane");
          const doneEntries = activeEntries.filter((e) => e.klient && isRealized(e));
          const plannedEntries = activeEntries.filter((e) => e.statusZlecenia === "Zaplanowane");
          const hasExpense = activeEntries.some((e) => Number(e.wydatki) > 0 && !e.klient);
          const allCancelled = cell.entries.length > 0 && cell.entries.every((e) => e.statusZlecenia === "Odwołane");
          const dayZarobki = doneEntries.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
          const intensity = Math.min(1, dayZarobki / 400);
          const isPlannedOnly = plannedEntries.length > 0 && doneEntries.length === 0;
          const isFree = !!cell.freeDay && doneEntries.length === 0 && plannedEntries.length === 0;
          return (
            <button
              key={idx}
              onClick={() => onAddForDay(cell.dateStr)}
              className="aspect-square rounded-lg flex flex-col items-center justify-center relative text-xs transition hover:ring-2"
              style={{
                background: doneEntries.length
                  ? `rgba(31,110,92,${0.15 + intensity * 0.55})`
                  : isPlannedOnly
                  ? "#EAF1F8"
                  : isFree
                  ? "#FDF6E9"
                  : isWeekend(cell.dateStr) ? "#F0EDE6" : "#FAFBFA",
                border: isPlannedOnly ? "1px dashed #2A5C8A" : isFree ? "1px solid #EED9A8" : allCancelled ? "1px solid #E5E7EB" : "1px solid transparent",
                color: doneEntries.length && intensity > 0.5 ? "white" : isPlannedOnly ? "#2A5C8A" : isFree ? "#8A6A1F" : allCancelled ? "#B0B8B5" : INK,
                ringColor: PRIMARY,
              }}
              title={cell.freeDay ? `Wolne${cell.freeDay.opis ? ": " + cell.freeDay.opis : ""}` : cell.entries.length ? `${cell.entries.length} wpis(ów)` : "Dodaj wpis"}
            >
              <span style={{ fontFamily: MONO_FONT, fontWeight: 500, textDecoration: allCancelled ? "line-through" : "none" }}>{cell.day}</span>
              {hasExpense && <span className="absolute bottom-1 w-1 h-1 rounded-full" style={{ background: CORAL }} />}
              {isFree && <Umbrella size={9} className="absolute bottom-1" />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function EntriesTable({ entries, onEdit, onDelete, showMonth, onJumpToMonth, onSetStatus, onMove }) {
  if (entries.length === 0) {
    return (
      <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
        {showMonth ? "Brak wyników dla podanej frazy w całym roku." : "Brak wpisów w tym miesiącu. Kliknij dzień w kalendarzu albo „Dodaj wpis”, żeby zacząć."}
      </div>
    );
  }
  const headers = showMonth
    ? ["Data", "Miesiąc", "Klient", "Adres", "Opis", "Godz.", "Zarobki", "Wydatki", "Kategoria", "Zlecenie", "Płatność", ""]
    : ["Data", "Klient", "Adres", "Opis", "Godz.", "Zarobki", "Wydatki", "Kategoria", "Zlecenie", "Płatność", ""];
  return (
    <div className="rounded-xl overflow-hidden" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      <div className="overflow-x-auto">
        <table className="w-full text-sm" style={{ minWidth: showMonth ? 1000 : 900 }}>
          <thead>
            <tr style={{ background: "#F0F5F2" }}>
              {headers.map((h) => (
                <th key={h} className="text-left px-3 py-2 text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#5B6E67" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {entries.map((e) => {
              const weekend = e.data ? isWeekend(e.data) : false;
              const entryMonth = e.data ? new Date(e.data + "T00:00:00").getMonth() : null;
              const orderStatus = e.statusZlecenia || "Wykonane";
              const isCancelled = orderStatus === "Odwołane";
              const isPlanned = orderStatus === "Zaplanowane";
              const isOverdue = isPlanned && e.data && e.data < todayStr();
              return (
                <tr
                  key={e.id}
                  className="border-t transition hover:bg-gray-50"
                  style={{
                    borderColor: LINE_COLOR,
                    background: isCancelled ? "#FAFAFA" : isPlanned ? "#F7FAFD" : weekend ? "#FAF8F3" : "transparent",
                    opacity: isCancelled ? 0.55 : 1,
                  }}
                >
                  <td className="px-3 py-2.5 whitespace-nowrap">
                    <div style={{ fontFamily: MONO_FONT, fontSize: "0.82rem" }}>{e.data ? e.data.slice(8, 10) + "." + e.data.slice(5, 7) : "—"}</div>
                    <div className="text-[10px] capitalize" style={{ color: "#8CA098" }}>
                      {e.data ? weekdayName(e.data) : ""}{e.godzinaStart ? ` · ${e.godzinaStart}` : ""}
                    </div>
                  </td>
                  {showMonth && (
                    <td className="px-3 py-2.5">
                      {entryMonth !== null ? (
                        <button
                          onClick={() => onJumpToMonth(entryMonth)}
                          className="text-[11px] px-2 py-0.5 rounded-full font-medium transition hover:opacity-80"
                          style={{ background: MINT, color: PRIMARY_DARK }}
                        >
                          {MONTH_NAMES[entryMonth]}
                        </button>
                      ) : "—"}
                    </td>
                  )}
                  <td className="px-3 py-2.5">{e.klient || <span style={{ color: "#C7D6CF" }}>—</span>}</td>
                  <td className="px-3 py-2.5" style={{ color: "#5B6E67" }}>{e.adres || "—"}</td>
                  <td className="px-3 py-2.5" style={{ color: "#5B6E67" }}>{e.opisUslugi || e.opisWydatkow || "—"}</td>
                  <td className="px-3 py-2.5" style={{ fontFamily: MONO_FONT }}>{e.godziny ? fmtNum(e.godziny, " h") : "—"}</td>
                  <td className="px-3 py-2.5 font-semibold" style={{ fontFamily: MONO_FONT, color: e.zarobki ? PRIMARY_DARK : "#C7D6CF" }}>
                    {e.zarobki ? fmtPLN(e.zarobki) : "—"}
                  </td>
                  <td className="px-3 py-2.5" style={{ fontFamily: MONO_FONT, color: e.wydatki ? CORAL : "#C7D6CF" }}>
                    {e.wydatki ? fmtPLN(e.wydatki) : "—"}
                  </td>
                  <td className="px-3 py-2.5">
                    {e.kategoria ? (
                      <span className="inline-flex items-center gap-1.5 text-[11px] px-2 py-0.5 rounded-full" style={{ background: `${CATEGORY_COLORS[e.kategoria]}1A`, color: CATEGORY_COLORS[e.kategoria] }}>
                        <span className="w-1.5 h-1.5 rounded-full" style={{ background: CATEGORY_COLORS[e.kategoria] }} />
                        {e.kategoria}
                      </span>
                    ) : "—"}
                  </td>
                  <td className="px-3 py-2.5">
                    <span className={`inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full border ${ORDER_STATUS_STYLES[orderStatus] || ""}`}>
                      {isOverdue ? <AlertTriangle size={11} /> : <OrderStatusIcon status={orderStatus} />}
                      {isOverdue ? "Zaległe" : orderStatus}
                    </span>
                  </td>
                  <td className="px-3 py-2.5">
                    {e.status ? (
                      <span className={`text-[11px] px-2 py-0.5 rounded-full border ${STATUS_STYLES[e.status] || ""}`}>{e.status}</span>
                    ) : "—"}
                  </td>
                  <td className="px-3 py-2.5">
                    <div className="flex items-center gap-1 justify-end">
                      {isPlanned && (
                        <button onClick={() => onSetStatus(e.id, "Wykonane")} className="p-1.5 rounded-md hover:bg-emerald-50 transition" title="Oznacz jako wykonane">
                          <CheckCircle2 size={14} color={PRIMARY} />
                        </button>
                      )}
                      {!isCancelled && (
                        <button onClick={() => onMove(e)} className="p-1.5 rounded-md hover:bg-sky-50 transition" title="Przenieś termin">
                          <Move size={14} color="#2A5C8A" />
                        </button>
                      )}
                      <button onClick={() => onEdit(e)} className="p-1.5 rounded-md hover:bg-gray-100 transition" title="Edytuj">
                        <Pencil size={14} color="#5B6E67" />
                      </button>
                      <button onClick={() => onDelete(e.id)} className="p-1.5 rounded-md hover:bg-red-50 transition" title="Usuń">
                        <Trash2 size={14} color={CORAL} />
                      </button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Summary View                                                         */
/* ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ */
/* Upcoming View — planowanie i nadzór przyszłych zleceń                */
/* ------------------------------------------------------------------ */
function UpcomingView({ data, onEdit, onDelete, onSetStatus, onMove, onJumpToMonth }) {
  const { overdue, upcoming, zarobkiPlanowane, liczba, next7count } = data;
  const isEmpty = overdue.length === 0 && upcoming.length === 0;

  const monthGroups = useMemo(() => {
    const groups = {};
    [...overdue, ...upcoming].forEach((e) => {
      if (!e.data) return;
      const key = e.data.slice(0, 7); // "YYYY-MM"
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    return Object.keys(groups).sort().map((key) => {
      const [y, m] = key.split("-").map(Number);
      return { year: y, month: m - 1, entries: groups[key] };
    });
  }, [overdue, upcoming]);

  return (
    <div className="space-y-6">
      <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.6rem", fontWeight: 600, color: PRIMARY_DARK }}>
        Nadchodzące zlecenia
      </h2>

      <div className="flex gap-3 flex-wrap">
        <KpiCard icon={CalendarClock} label="Zaplanowane" value={liczba} accent="#2A5C8A" />
        <KpiCard icon={Wallet} label="Spodziewany przychód" value={fmtPLN(zarobkiPlanowane)} accent="#2A5C8A" />
        <KpiCard icon={Clock} label="W ciągu 7 dni" value={next7count} />
        {overdue.length > 0 && <KpiCard icon={AlertTriangle} label="Zaległe" value={overdue.length} accent={CORAL} />}
      </div>

      {isEmpty && (
        <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
          Brak zaplanowanych zleceń. Kliknij „Zaplanuj zlecenie” na górze, żeby dodać pierwsze.
        </div>
      )}

      {monthGroups.length > 0 && (
        <div className="flex gap-4 flex-wrap">
          {monthGroups.map((g) => (
            <MiniMonthCalendar key={`${g.year}-${g.month}`} year={g.year} month={g.month} entries={g.entries} onDayClick={() => onJumpToMonth(g.month)} />
          ))}
        </div>
      )}

      {overdue.length > 0 && (
        <div>
          <h3 className="text-sm font-semibold mb-2 flex items-center gap-1.5" style={{ color: CORAL }}>
            <AlertTriangle size={14} /> Zaległe — minęła data, zaktualizuj status ({overdue.length})
          </h3>
          <UpcomingList entries={overdue} overdue onEdit={onEdit} onDelete={onDelete} onSetStatus={onSetStatus} onMove={onMove} onJumpToMonth={onJumpToMonth} />
        </div>
      )}

      {upcoming.length > 0 && (
        <div>
          <h3 className="text-sm font-semibold mb-2" style={{ color: PRIMARY_DARK }}>
            Nadchodzące ({upcoming.length})
          </h3>
          <UpcomingList entries={upcoming} onEdit={onEdit} onDelete={onDelete} onSetStatus={onSetStatus} onMove={onMove} onJumpToMonth={onJumpToMonth} />
        </div>
      )}
    </div>
  );
}

function MiniMonthCalendar({ year, month, entries, onDayClick }) {
  const cells = useMemo(() => {
    const first = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startOffset = (first.getDay() + 6) % 7;
    const byDay = {};
    entries.forEach((e) => {
      const d = Number(e.data.slice(8, 10));
      if (!byDay[d]) byDay[d] = [];
      byDay[d].push(e);
    });
    const list = [];
    for (let i = 0; i < startOffset; i++) list.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      list.push({ day: d, dateStr, entries: byDay[d] || [] });
    }
    return list;
  }, [year, month, entries]);

  return (
    <div className="rounded-xl p-4 flex-1 min-w-[280px]" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      <h3 className="text-sm font-semibold mb-3" style={{ color: PRIMARY_DARK }}>
        {MONTH_NAMES[month]} <span style={{ color: "#8CA098", fontWeight: 400 }}>{year}</span>
      </h3>
      <div className="grid grid-cols-7 gap-1 mb-1">
        {WEEKDAY_LETTERS.map((w) => (
          <div key={w} className="text-center text-[9px] font-semibold uppercase" style={{ color: "#8CA098" }}>{w}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((cell, idx) => {
          if (!cell) return <div key={idx} />;
          const hasEntries = cell.entries.length > 0;
          const isOverdue = hasEntries && cell.dateStr < todayStr();
          const isToday = cell.dateStr === todayStr();
          return (
            <button
              key={idx}
              onClick={() => hasEntries && onDayClick(cell.dateStr)}
              disabled={!hasEntries}
              className="aspect-square rounded-md flex items-center justify-center text-[11px] transition"
              style={{
                background: isOverdue ? "#FDECEA" : hasEntries ? "#EAF1F8" : "transparent",
                border: isOverdue ? "1px dashed #E0665A" : hasEntries ? "1px dashed #2A5C8A" : isToday ? "1px solid #2A5C8A" : "1px solid transparent",
                color: isOverdue ? CORAL : hasEntries ? "#2A5C8A" : isToday ? "#2A5C8A" : "#B0B8B5",
                fontFamily: MONO_FONT,
                fontWeight: hasEntries || isToday ? 600 : 400,
                cursor: hasEntries ? "pointer" : "default",
              }}
              title={hasEntries ? `${cell.entries.length} zaplanowane` : ""}
            >
              {cell.day}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ClientsView({ clients, entries, search, setSearch, onAdd, onEdit, onDelete, onAddOrder }) {
  const stats = useMemo(() => {
    const map = {};
    (entries || []).forEach((e) => {
      if (!e.klient || !e.klient.trim()) return;
      if (!map[e.klient]) map[e.klient] = { zarobki: 0, liczba: 0 };
      if (isRealized(e)) map[e.klient].zarobki += Number(e.zarobki) || 0;
      map[e.klient].liczba += 1;
    });
    return map;
  }, [entries]);

  const filtered = clients
    .filter((c) => {
      if (!search.trim()) return true;
      const s = search.toLowerCase();
      return c.name.toLowerCase().includes(s) || (c.adres || "").toLowerCase().includes(s);
    })
    .sort((a, b) => a.name.localeCompare(b.name, "pl"));

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.6rem", fontWeight: 600, color: PRIMARY_DARK }}>
          Baza klientów
        </h2>
        <button
          onClick={onAdd}
          className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold text-white transition hover:opacity-90"
          style={{ background: PRIMARY }}
        >
          <Plus size={15} /> Dodaj klienta
        </button>
      </div>

      <input
        type="text"
        placeholder="Szukaj po nazwie lub adresie…"
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        className="w-full sm:w-80 px-3 py-2 rounded-lg text-sm border"
        style={{ borderColor: LINE_COLOR, background: SURFACE }}
      />

      {filtered.length === 0 ? (
        <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
          {clients.length === 0 ? "Brak klientów w bazie. Dodaj pierwszego, żeby móc go wybierać z listy przy planowaniu zleceń." : "Brak wyników dla podanej frazy."}
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {filtered.map((c) => {
            const s = stats[c.name] || { zarobki: 0, liczba: 0 };
            return (
              <div key={c.id} className="rounded-xl p-4 flex flex-col gap-2" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <div className="font-semibold" style={{ color: INK }}>{c.name}</div>
                    {c.adres && <div className="text-xs" style={{ color: "#8CA098" }}>{c.adres}</div>}
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <button onClick={() => onAddOrder(c)} className="p-1.5 rounded-md hover:bg-emerald-50 transition" title="Zaplanuj zlecenie dla tego klienta">
                      <CalendarClock size={14} color={PRIMARY} />
                    </button>
                    <button onClick={() => onEdit(c)} className="p-1.5 rounded-md hover:bg-gray-100 transition" title="Edytuj">
                      <Pencil size={14} color="#5B6E67" />
                    </button>
                    <button onClick={() => onDelete(c.id)} className="p-1.5 rounded-md hover:bg-red-50 transition" title="Usuń">
                      <Trash2 size={14} color={CORAL} />
                    </button>
                  </div>
                </div>
                <div className="flex items-center gap-3 text-xs" style={{ color: "#5B6E67" }}>
                  {c.telefon && <span>📞 {c.telefon}</span>}
                  {c.typKlienta && (
                    <span className="px-2 py-0.5 rounded-full" style={{ background: MINT, color: PRIMARY_DARK }}>{c.typKlienta}</span>
                  )}
                </div>
                {c.uwagi && <div className="text-xs italic" style={{ color: "#8CA098" }}>{c.uwagi}</div>}
                {s.liczba > 0 && (
                  <div className="text-xs pt-1 border-t" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
                    {s.liczba} {s.liczba === 1 ? "zlecenie" : "zleceń"} · <span style={{ fontFamily: MONO_FONT, fontWeight: 600, color: PRIMARY_DARK }}>{fmtPLN(s.zarobki)}</span> łącznie
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

        <div className="sticky top-0 flex items-center justify-between px-5 py-4 border-b" style={{ background: SURFACE, borderColor: LINE_COLOR }}>
          <h3 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.15rem", fontWeight: 600, color: PRIMARY_DARK }}>
            {isEditing ? (formType === "full" ? "Edytuj wpis" : formType === "zakup" ? "Edytuj zakup" : "Edytuj zlecenie") : titles[formType]}
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>

        <div className="p-5 space-y-4">
          <FormField label="Data">
            <input type="date" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.data} onChange={(e) => onChange("data", e.target.value)} />
          </FormField>

          {showKlientFields && (
            <>
              {formType === "full" && (
                <div className="flex items-center gap-2 pt-1">
                  <Users size={14} color={PRIMARY_DARK} />
                  <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: PRIMARY_DARK }}>Zlecenie</span>
                  <span className="flex-1 h-px" style={{ background: LINE_COLOR }} />
                </div>
              )}

              <FormField label="Status zlecenia">
                <div className="inline-flex rounded-lg border overflow-hidden w-full" style={{ borderColor: LINE_COLOR }}>
                  {ORDER_STATUSES.map((s) => (
                    <button
                      key={s}
                      type="button"
                      onClick={() => onChange("statusZlecenia", s)}
                      className="flex-1 px-2 py-2 text-xs font-medium transition"
                      style={{
                        background: form.statusZlecenia === s ? (s === "Zaplanowane" ? "#2A5C8A" : s === "Odwołane" ? "#8CA098" : PRIMARY) : "transparent",
                        color: form.statusZlecenia === s ? "white" : "#5B6E67",
                      }}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </FormField>

              <div className="grid grid-cols-2 gap-3">
                <FormField label="Klient">
                  <select
                    className={inputCls}
                    style={{ borderColor: LINE_COLOR }}
                    value={showNewClientInput ? "__new__" : form.klient}
                    onChange={(e) => {
                      if (e.target.value === "__new__") {
                        setShowNewClientInput(true);
                        onChange("klient", "");
                      } else {
                        setShowNewClientInput(false);
                        onChange("klient", e.target.value);
                      }
                    }}
                  >
                    <option value="">— Wybierz klienta —</option>
                    {knownClients.list.map((c) => <option key={c.name} value={c.name}>{c.name}</option>)}
                    <option value="__new__">➕ Nowy klient (wpisz ręcznie)</option>
                  </select>
                </FormField>
                <FormField label="Adres">
                  <input type="text" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.adres} onChange={(e) => onChange("adres", e.target.value)} placeholder="np. Bolesławiec" />
                </FormField>
              </div>

              {showNewClientInput && (
                <FormField label="Imię i nazwisko / nazwa nowego klienta">
                  <input
                    type="text"
                    autoFocus
                    className={inputCls}
                    style={{ borderColor: LINE_COLOR }}
                    value={form.klient}
                    onChange={(e) => onChange("klient", e.target.value)}
                    placeholder="np. Izabela Kowal"
                  />
                </FormField>
              )}

              {form.klient.trim() && !knownClients.list.find((c) => c.name === form.klient.trim()) && (
                <label className="flex items-center gap-2 text-sm -mt-1" style={{ color: "#5B6E67" }}>
                  <input
                    type="checkbox"
                    checked={form.saveClientToList}
                    onChange={(e) => onChange("saveClientToList", e.target.checked)}
                    className="w-4 h-4 rounded"
                    style={{ accentColor: PRIMARY }}
                  />
                  Dodaj „{form.klient.trim()}” do bazy klientów
                </label>
              )}

              <FormField label="Opis usługi">
                <input type="text" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.opisUslugi} onChange={(e) => onChange("opisUslugi", e.target.value)} />
              </FormField>

              <div className="grid grid-cols-2 gap-3">
                <FormField label="Godzina rozpoczęcia">
                  <input type="time" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.godzinaStart} onChange={(e) => onChange("godzinaStart", e.target.value)} />
                </FormField>
                <FormField label="Przewidywany czas pracy (h)">
                  <input type="number" step="0.5" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.godziny} onChange={(e) => onChange("godziny", e.target.value)} placeholder="np. 2" />
                </FormField>
              </div>

              <FormField label="Zarobki (zł)">
                <input type="number" step="0.01" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.zarobki} onChange={(e) => onChange("zarobki", e.target.value)} />
              </FormField>

              {(formType === "full" || isEditing) && (
                <FormField label="Typ klienta">
                  <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.typKlienta} onChange={(e) => onChange("typKlienta", e.target.value)}>
                    <option value="">—</option>
                    {CLIENT_TYPES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </FormField>
              )}

              <FormField label="Status płatności">
                <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.status} onChange={(e) => onChange("status", e.target.value)}>
                  <option value="">—</option>
                  {STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </FormField>

              {formType === "full" && (
                <FormField label="Uwagi (zlecenie)">
                  <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 50 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
                </FormField>
              )}
            </>
          )}

          {showZakupFields && (
            <>
              {formType === "full" && (
                <div className="flex items-center gap-2 pt-2">
                  <Receipt size={14} color={CORAL} />
                  <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: CORAL }}>Zakupy</span>
                  <span className="flex-1 h-px" style={{ background: LINE_COLOR }} />
                </div>
              )}

              <FormField label="Opis wydatków">
                <input type="text" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.opisWydatkow} onChange={(e) => onChange("opisWydatkow", e.target.value)} placeholder="np. Płyny, paliwo…" autoFocus={formType === "zakup"} />
              </FormField>

              <div className="grid grid-cols-2 gap-3">
                <FormField label="Kwota (zł)">
                  <input type="number" step="0.01" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.wydatki} onChange={(e) => onChange("wydatki", e.target.value)} />
                </FormField>
                <FormField label="Kategoria wydatku">
                  <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.kategoria} onChange={(e) => onChange("kategoria", e.target.value)}>
                    <option value="">—</option>
                    {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </FormField>
              </div>

              <FormField label={formType === "full" ? "Uwagi (zakupy)" : "Uwagi"}>
                <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 50 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
              </FormField>
            </>
          )}

          {formType === "klient" && (
            <FormField label="Uwagi">
              <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 60 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
            </FormField>
          )}
        </div>

        <div className="sticky bottom-0 flex gap-2 px-5 py-4 border-t" style={{ background: SURFACE, borderColor: LINE_COLOR }}>
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={onSave}
            disabled={!form.data}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
            style={{ background: accentColor }}
          >
            {isEditing ? "Zapisz zmiany" : formType === "zakup" ? "Dodaj zakup" : "Zaplanuj zlecenie"}
          </button>
        </div>
      </div>
    </div>
  );
}

const DETAIL_CONFIG = {
  zarobki: { title: "Zarobki (wykonane)", icon: Wallet, color: PRIMARY_DARK, empty: "Brak zarobków w tym miesiącu." },
  wydatki: { title: "Wydatki", icon: Receipt, color: CORAL, empty: "Brak wydatków w tym miesiącu." },
  zaplanowane: { title: "Zaplanowane zlecenia", icon: CalendarClock, color: "#2A5C8A", empty: "Brak zaplanowanych zleceń w tym miesiącu." },
  wolne: { title: "Dni wolne", icon: Umbrella, color: "#8A6A1F", empty: "Brak dni wolnych w tym miesiącu." },
};

function KpiDetailModal({ type, entries, freeDays, onEdit, onClose }) {
  const cfg = DETAIL_CONFIG[type];
  const Icon = cfg.icon;
  const isFreeDays = type === "wolne";
  const items = isFreeDays ? freeDays.slice().sort((a, b) => a.date.localeCompare(b.date)) : entries;
  const amountKey = type === "wydatki" ? "wydatki" : "zarobki";
  const total = isFreeDays ? null : items.reduce((s, e) => s + (Number(e[amountKey]) || 0), 0);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full sm:max-w-md max-h-[85vh] flex flex-col rounded-t-2xl sm:rounded-2xl" style={{ background: SURFACE }}>
        <div className="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style={{ borderColor: LINE_COLOR }}>
          <h3 className="flex items-center gap-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", fontWeight: 600, color: cfg.color }}>
            <Icon size={17} /> {cfg.title}
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>

        {total !== null && (
          <div className="px-5 py-3 border-b flex items-center justify-between flex-shrink-0" style={{ borderColor: LINE_COLOR, background: "#FAFBFA" }}>
            <span className="text-xs font-medium uppercase tracking-wide" style={{ color: "#5B6E67" }}>Razem ({items.length})</span>
            <span style={{ fontFamily: MONO_FONT, fontWeight: 700, fontSize: "1.05rem", color: cfg.color }}>{fmtPLN(total)}</span>
          </div>
        )}

        <div className="overflow-y-auto flex-1">
          {items.length === 0 ? (
            <div className="p-8 text-center text-sm" style={{ color: "#8CA098" }}>{cfg.empty}</div>
          ) : isFreeDays ? (
            <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
              {items.map((fd) => (
                <div key={fd.id} className="px-5 py-3 flex items-center gap-3">
                  <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: "#8A6A1F", minWidth: 56 }}>
                    {fd.date.slice(8, 10)}.{fd.date.slice(5, 7)}
                  </div>
                  <div className="text-sm capitalize" style={{ color: "#5B6E67" }}>{weekdayName(fd.date)}</div>
                  {fd.opis && <div className="text-sm ml-auto" style={{ color: INK }}>{fd.opis}</div>}
                </div>
              ))}
            </div>
          ) : (
            <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
              {items.map((e) => (
                <button
                  key={e.id}
                  onClick={() => { onEdit(e); onClose(); }}
                  className="w-full px-5 py-3 flex items-center gap-3 text-left hover:bg-gray-50 transition"
                >
                  <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: cfg.color, minWidth: 56 }}>
                    {e.data.slice(8, 10)}.{e.data.slice(5, 7)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium truncate">{e.klient || e.opisWydatkow || "—"}</div>
                    {(e.adres || e.opisUslugi) && <div className="text-xs truncate" style={{ color: "#8CA098" }}>{e.adres || e.opisUslugi}</div>}
                  </div>
                  <div style={{ fontFamily: MONO_FONT, fontWeight: 600, color: cfg.color, flexShrink: 0 }}>
                    {fmtPLN(Number(e[amountKey]) || 0)}
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function MoveModal({ moveInfo, onChange, onClose, onSave }) {
  const label = moveInfo.klient || moveInfo.opisWydatkow || "wpis";
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl" style={{ background: SURFACE }}>
        <div className="flex items-center justify-between px-5 py-4 border-b" style={{ borderColor: LINE_COLOR }}>
          <h3 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", fontWeight: 600, color: PRIMARY_DARK }}>
            Przenieś termin
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>
        <div className="p-5 space-y-4">
          <p className="text-sm" style={{ color: "#5B6E67" }}>
            Przenosisz termin: <strong style={{ color: INK }}>{label}</strong>
          </p>
          <FormField label="Nowa data">
            <input type="date" className={inputCls} style={{ borderColor: LINE_COLOR }} value={moveInfo.newDate} onChange={(e) => onChange("newDate", e.target.value)} />
          </FormField>
          <FormField label="Nowa godzina (opcjonalnie)">
            <input type="time" className={inputCls} style={{ borderColor: LINE_COLOR }} value={moveInfo.newTime} onChange={(e) => onChange("newTime", e.target.value)} />
          </FormField>
        </div>
        <div className="flex gap-2 px-5 py-4 border-t" style={{ borderColor: LINE_COLOR }}>
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={onSave}
            disabled={!moveInfo.newDate}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
            style={{ background: "#2A5C8A" }}
          >
            Przenieś
          </button>
        </div>
      </div>
    </div>
  );
}

function BackupsPanel({ backups, loading, hasFirebase, onExport, onRestore, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full sm:max-w-md max-h-[85vh] flex flex-col rounded-t-2xl sm:rounded-2xl" style={{ background: SURFACE }}>
        <div className="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style={{ borderColor: LINE_COLOR }}>
          <h3 className="flex items-center gap-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", fontWeight: 600, color: PRIMARY_DARK }}>
            <Shield size={17} /> Kopie zapasowe
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>

        <div className="p-5 space-y-4 overflow-y-auto flex-1">
          <div>
            <p className="text-sm mb-2" style={{ color: "#5B6E67" }}>
              Pobierz wszystkie swoje dane jako plik na telefon — dobra dodatkowa kopia niezależna od aplikacji.
            </p>
            <button
              onClick={onExport}
              className="w-full px-4 py-2.5 rounded-lg text-sm font-semibold text-white"
              style={{ background: PRIMARY }}
            >
              Pobierz kopię teraz (plik)
            </button>
          </div>

          <div className="h-px" style={{ background: LINE_COLOR }} />

          <div>
            <p className="text-sm mb-2" style={{ color: "#5B6E67" }}>
              Aplikacja sama zapisuje codzienną kopię danych w chmurze — w razie pomyłki możesz wrócić do dowolnego dnia z ostatnich 30.
            </p>
            {!hasFirebase && (
              <div className="text-xs p-3 rounded-lg" style={{ background: "#FDF6E9", color: "#8A6A1F" }}>
                Automatyczne kopie w chmurze są dostępne tylko, gdy aplikacja jest połączona z bazą danych.
              </div>
            )}
            {hasFirebase && loading && (
              <div className="text-sm text-center py-6" style={{ color: "#8CA098" }}>Wczytywanie…</div>
            )}
            {hasFirebase && !loading && backups.length === 0 && (
              <div className="text-sm text-center py-6" style={{ color: "#8CA098" }}>Jeszcze brak zapisanych kopii — pojawią się automatycznie po dzisiejszych zmianach.</div>
            )}
            {hasFirebase && !loading && backups.length > 0 && (
              <div className="space-y-2">
                {backups.map((b) => (
                  <div key={b.id} className="flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg" style={{ border: `1px solid ${LINE_COLOR}` }}>
                    <div>
                      <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: INK }}>
                        {b.id.split("-").reverse().join(".")}
                      </div>
                      <div className="text-xs" style={{ color: "#8CA098" }}>
                        {(b.items || []).length} wpisów · {(b.clients || []).length} klientów
                      </div>
                    </div>
                    <button
                      onClick={() => onRestore(b)}
                      className="text-xs font-semibold px-3 py-1.5 rounded-lg border transition hover:bg-gray-50"
                      style={{ borderColor: PRIMARY, color: PRIMARY }}
                    >
                      Przywróć
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function FreeDayModal({ form, onChange, onClose, onSave }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl" style={{ background: SURFACE }}>
        <div className="flex items-center justify-between px-5 py-4 border-b" style={{ borderColor: LINE_COLOR }}>
          <h3 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", fontWeight: 600, color: "#8A6A1F" }}>
            Zaplanuj dzień wolny
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>
        <div className="p-5 space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <FormField label="Od dnia">
              <input type="date" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.start} onChange={(e) => onChange("start", e.target.value)} />
            </FormField>
            <FormField label="Do dnia (opcjonalnie)">
              <input type="date" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.end} onChange={(e) => onChange("end", e.target.value)} />
            </FormField>
          </div>
          <FormField label="Powód (opcjonalnie)">
            <input type="text" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.opis} onChange={(e) => onChange("opis", e.target.value)} placeholder="np. Urlop, Święto" />
          </FormField>
        </div>
        <div className="flex gap-2 px-5 py-4 border-t" style={{ borderColor: LINE_COLOR }}>
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={onSave}
            disabled={!form.start}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
            style={{ background: "#C99A2E" }}
          >
            Zapisz
          </button>
        </div>
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, confirmLabel, onConfirm, onCancel }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: SURFACE }}>
        <h3 className="font-semibold mb-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", color: PRIMARY_DARK }}>{title}</h3>
        <p className="text-sm mb-5" style={{ color: "#5B6E67" }}>{message}</p>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>Anuluj</button>
          <button onClick={onConfirm} className="flex-1 px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: CORAL }}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
