  function saveClientRecord() {
    if (!clientForm.name.trim()) return;
    let next;
    if (editingClientId) {
      next = clients.map((c) => (c.id === editingClientId ? { ...c, ...clientForm, name: clientForm.name.trim() } : c));
    } else {
      next = [...clients, { id: Date.now() + Math.random(), ...clientForm, name: clientForm.name.trim() }];
    }
    setClients(next);
    syncToFirestore(entries, freeDays, next);
    setShowClientForm(false);
  }

  function deleteClientRecord(id) {
    const next = clients.filter((c) => c.id !== id);
    setClients(next);
    syncToFirestore(entries, freeDays, next);
  }

  if (entries === null) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: BG }}>
        <div className="flex items-center gap-2 text-sm" style={{ color: INK, fontFamily: BODY_FONT }}>
          <Sparkles size={16} className="animate-pulse" /> Wczytywanie rejestru…
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ background: BG, fontFamily: BODY_FONT, color: INK }}>
      <FontImport />
      <Header
        saveState={saveState}
        onBackups={() => { setShowBackupsPanel(true); loadBackupsList(); }}
        onUndo={undoLastChange}
        undoCount={undoHistory.length}
        year={year}
        onYearChange={setYear}
      />

      {wwwQueue.length > 0 && (
        <WwwOrderPopup
          entry={wwwQueue[0]}
          remaining={wwwQueue.length - 1}
          onClose={() => setWwwQueue((q) => q.slice(1))}
          onJumpToDay={(dateStr) => {
            setWwwQueue((q) => q.slice(1));
            setActiveTab(new Date(dateStr + "T00:00:00").getMonth());
            setYear(new Date(dateStr + "T00:00:00").getFullYear());
            setView("month");
          }}
        />
      )}

      <TabBar
        activeTab={activeTab}
        view={view}
        year={year}
        onSelectMonth={(i) => { setActiveTab(i); setView("month"); }}
        yearData={yearData}
      />

      <ActionBar
        view={view}
        upcomingCount={upcomingData.upcoming.length + upcomingData.overdue.length}
        overdueCount={upcomingData.overdue.length}
        completedCount={completedData.liczba}
        invoicesCount={invoicesData.totalCount}
        onAddClient={() => openAddClientForm()}
        onAddPurchase={() => openAddPurchaseForm()}
        onAddPrivate={() => openAddPrivateForm()}
        onAddFreeDay={() => setShowFreeDaysList(true)}
        onGoUpcoming={() => setView("upcoming")}
        onGoCompleted={() => setView("wykonane")}
        onGoFaktury={() => setView("faktury")}
        onGoOverdue={() => setView("overdue")}
        onGoSummary={() => setView("summary")}
        onGoClients={() => setView("clients")}
      />

      <main className="max-w-6xl mx-auto px-4 sm:px-6 pb-24 pt-4">
        {view === "month" && (
          <MonthView
            key={activeTab}
            monthName={MONTH_NAMES[activeTab]}
            year={year}
            isCurrentMonth={!isYearSearch && year === new Date().getFullYear() && activeTab === new Date().getMonth()}
            summary={monthSummary}
            detailLists={monthDetailLists}
            entries={monthEntries}
            calendarCells={calendarCells}
            freeDays={freeDays.filter((d) => d.date.startsWith(`${year}-${String(activeTab + 1).padStart(2, "0")}`))}
            search={search}
            setSearch={setSearch}
            searchScope={searchScope}
            setSearchScope={setSearchScope}
            isYearSearch={isYearSearch}
            onAddForDay={(dateStr) => openAddClientForm(dateStr)}
            onEdit={openEditForm}
            onDelete={deleteEntry}
            onJumpToMonth={(monthIdx) => { setActiveTab(monthIdx); setSearch(""); }}
            onSetStatus={setEntryStatus}
            onMarkDone={openMarkDone}
            onMove={openMove}
            onRemoveFreeDay={(ids) => removeFreeDayGroup(ids)}
            onEditFreeDay={openEditFreeDayGroup}
            onMoveFreeDay={openMoveFreeDayGroup}
            onGoUpcoming={() => setView("upcoming")}
            onSetPaymentStatus={setPaymentStatus}
            onToggleInvoice={toggleInvoiceIssued}
          />
        )}
        {view === "summary" && <SummaryView yearData={yearData} year={year} entries={entries} onGoUpcoming={() => setView("upcoming")} onEdit={openEditForm} onToggleInvoice={toggleInvoiceIssued} onSetPaymentStatus={setPaymentStatus} />}
        {view === "upcoming" && (
          <UpcomingView
            data={upcomingData}
            entries={entries}
            onEdit={openEditForm}
            onDelete={deleteEntry}
            onSetStatus={setEntryStatus}
            onMarkDone={openMarkDone}
            onMove={openMove}
            onAddForDay={(dateStr) => openAddClientForm(dateStr)}
            onJumpToMonth={(monthIdx) => { setActiveTab(monthIdx); setView("month"); }}
          />
        )}
        {view === "overdue" && (
          <OverdueView
            overdue={upcomingData.overdue}
            entries={entries}
            onEdit={openEditForm}
            onDelete={deleteEntry}
            onSetStatus={setEntryStatus}
            onMarkDone={openMarkDone}
            onMove={openMove}
            onAddForDay={(dateStr) => openAddClientForm(dateStr)}
            onJumpToMonth={(monthIdx) => { setActiveTab(monthIdx); setView("month"); }}
          />
        )}
        {view === "wykonane" && (
          <CompletedView
            data={completedData}
            entries={entries}
            year={year}
            onEdit={openEditForm}
            onDelete={deleteEntry}
            onSetStatus={setEntryStatus}
            onMarkDone={openMarkDone}
            onMove={openMove}
            onAddForDay={(dateStr) => openAddClientForm(dateStr)}
            onJumpToMonth={(monthIdx) => { setActiveTab(monthIdx); setView("month"); }}
          />
        )}
        {view === "faktury" && (
          <FakturyView data={invoicesData} year={year} onEdit={openEditForm} onToggleInvoice={toggleInvoiceIssued} onSetPaymentStatus={setPaymentStatus} />
        )}
        {view === "clients" && (
          <ClientsView
            clients={clients}
            entries={entries}
            search={clientSearch}
            setSearch={setClientSearch}
            onAdd={openAddClientRecord}
            onEdit={openEditClientRecord}
            onDelete={deleteClientRecord}
            onAddOrder={openAddOrderForClient}
          />
        )}
      </main>

      {showForm && !conflictInfo && (
        <EntryFormModal
          form={form}
          isEditing={!!editingId}
          formType={formType}
          knownClients={knownClients}
          onChange={handleFormChange}
          onClose={() => setShowForm(false)}
          onSave={saveEntry}
        />
      )}

      {showBackupsPanel && !confirmRestoreBackup && (
        <BackupsPanel
          backups={backupsList}
          loading={backupsLoading}
          error={backupsError}
          hasFirebase={!!window.firebaseDb}
          onExport={exportBackupFile}
          onImportFile={handleImportFile}
          onRestore={(b) => setConfirmRestoreBackup(b)}
          onClose={() => setShowBackupsPanel(false)}
          onTestSave={testBackupWrite}
          testing={backupsTesting}
          testResult={backupsTestResult}
        />
      )}

      {confirmRestoreBackup && (
        <ConfirmModal
          title="Przywrócić tę kopię zapasową?"
          message={
            confirmRestoreBackup.fromFile
              ? `Obecne dane zostaną zastąpione zawartością pliku „${confirmRestoreBackup.fileName}” (${(confirmRestoreBackup.items || []).length} wpisów). Tej operacji nie da się cofnąć.`
              : `Obecne dane zostaną zastąpione stanem z kopii z dnia ${confirmRestoreBackup.id.split("-").reverse().join(".")}. Wszystko, co dodałaś/eś od tego dnia, zostanie utracone. Tej operacji nie da się cofnąć.`
          }
          confirmLabel="Przywróć"
          onConfirm={() => restoreBackup(confirmRestoreBackup)}
          onCancel={() => setConfirmRestoreBackup(null)}
        />
      )}

      {confirmDoneEntry && (
        <MarkDoneModal
          entry={confirmDoneEntry}
          form={doneForm}
          onChange={(field, value) => setDoneForm((f) => ({ ...f, [field]: value }))}
          onConfirm={confirmMarkDone}
          onCancel={() => setConfirmDoneEntry(null)}
        />
      )}

      {conflictInfo && conflictInfo.type === "time" && (
        <ConfirmModal
          title="Kolizja terminów"
          message={`Ten termin (${fmtTimeRange(conflictInfo.payload.godzinaStart, conflictInfo.payload.godziny)}) nakłada się z wizytą u „${conflictInfo.conflict.klient || conflictInfo.conflict.opisWydatkow || "innego klienta"}” (${fmtTimeRange(conflictInfo.conflict.godzinaStart, conflictInfo.conflict.godziny)}) tego samego dnia. Czy mimo to zapisać ten termin?`}
          confirmLabel="Zapisz mimo to"
          onConfirm={() => {
            commitPayload(conflictInfo.payload);
            setConflictInfo(null);
          }}
          onCancel={() => setConflictInfo(null)}
        />
      )}

      {conflictInfo && conflictInfo.type === "freeday" && (
        <ConfirmModal
          title="To dzień wolny"
          message={`${conflictInfo.payload.data.split("-").reverse().join(".")} jest oznaczony jako dzień wolny${conflictInfo.freeDay.opis ? ` („${conflictInfo.freeDay.opis}”)` : ""}. Czy mimo to zaplanować na ten dzień zlecenie?`}
          confirmLabel="Zaplanuj mimo to"
          onConfirm={() => {
            commitPayload(conflictInfo.payload);
            setConflictInfo(null);
          }}
          onCancel={() => setConflictInfo(null)}
        />
      )}

      {moveInfo && !moveConflict && (
        <MoveModal
          moveInfo={moveInfo}
          onChange={(field, value) => setMoveInfo((m) => ({ ...m, [field]: value }))}
          onClose={() => setMoveInfo(null)}
          onSave={() => performMove(false)}
        />
      )}

      {moveConflict && (
        <ConfirmModal
          title="Kolizja terminów"
          message={`Nowy termin (${fmtTimeRange(moveInfo.newTime, entries.find((e) => e.id === moveInfo.id)?.godziny)}) nakłada się z wizytą u „${moveConflict.conflict.klient || moveConflict.conflict.opisWydatkow || "innego klienta"}” (${fmtTimeRange(moveConflict.conflict.godzinaStart, moveConflict.conflict.godziny)}) tego samego dnia. Czy mimo to przenieść ten termin?`}
          confirmLabel="Przenieś mimo to"
          onConfirm={() => performMove(true)}
          onCancel={() => setMoveConflict(null)}
        />
      )}

      {showFreeDaysList && !showFreeDayForm && !movingFreeDayGroup && (
        <FreeDaysListModal
          freeDays={freeDays}
          year={year}
          onAddNew={() => { setShowFreeDaysList(false); openFreeDayForm(); }}
          onEdit={openEditFreeDayGroup}
          onMove={openMoveFreeDayGroup}
          onRemove={(group) => removeFreeDayGroup(group.ids)}
          onClose={() => setShowFreeDaysList(false)}
        />
      )}

      {movingFreeDayGroup && (
        <FreeDayMoveModal
          date={movingFreeDayDate}
          onChange={setMovingFreeDayDate}
          onClose={() => setMovingFreeDayGroup(null)}
          onSave={saveFreeDayMove}
        />
      )}

      {showFreeDayForm && !freeDayConflict && (
        <FreeDayModal
          form={freeDayForm}
          isEditing={!!editingFreeDayGroup}
          onChange={(field, value) => setFreeDayForm((f) => ({ ...f, [field]: value }))}
          onClose={() => { setShowFreeDayForm(false); setEditingFreeDayGroup(null); }}
          onSave={() => saveFreeDays(false)}
        />
      )}

      {freeDayConflict && (
        <ConfirmModal
          title="Masz już zaplanowane zlecenia"
          message={`W wybranym zakresie dat masz już ${freeDayConflict.conflicts.length} ${freeDayConflict.conflicts.length === 1 ? "zlecenie" : "zlecenie(a)"}: ${freeDayConflict.conflicts.slice(0, 4).map((e) => `${e.klient} (${e.data.split("-").reverse().join(".")})`).join(", ")}${freeDayConflict.conflicts.length > 4 ? "…" : ""}. Czy mimo to oznaczyć te dni jako wolne?`}
          confirmLabel="Oznacz mimo to"
          onConfirm={() => commitFreeDays(freeDayConflict.days)}
          onCancel={() => setFreeDayConflict(null)}
        />
      )}

      {showClientForm && (
        <ClientFormModal
          form={clientForm}
          isEditing={!!editingClientId}
          onChange={(field, value) => setClientForm((f) => ({ ...f, [field]: value }))}
          onClose={() => setShowClientForm(false)}
          onSave={saveClientRecord}
        />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Design tokens                                                       */
/* ------------------------------------------------------------------ */
const BG = "#F5F8F6";
const SURFACE = "#FFFFFF";
const INK = "#1C2B27";
const PRIMARY = "#1F6E5C";
const PRIMARY_DARK = "#154A3F";
const MINT = "#CFE9DE";
const GOLD = "#C99A2E";
const CORAL = "#E0665A";
const LINE_COLOR = "#E1E8E4";
const DISPLAY_FONT = "'Fraunces', serif";
const BODY_FONT = "'Inter', sans-serif";
const MONO_FONT = "'IBM Plex Mono', monospace";

function FontImport() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { height: 8px; width: 8px; }
      ::-webkit-scrollbar-thumb { background: #C7D6CF; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      input:focus, select:focus, textarea:focus, button:focus-visible {
        outline: 2px solid ${PRIMARY}; outline-offset: 1px;
      }
    `}</style>
  );
}

/* ------------------------------------------------------------------ */
/* Header + Tabs                                                       */
/* ------------------------------------------------------------------ */
function Header({ saveState, onBackups, onUndo, undoCount, year, onYearChange }) {
  return (
    <header className="border-b" style={{ borderColor: LINE_COLOR, background: SURFACE }}>
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: PRIMARY }}>
            <Sparkles size={19} color="white" strokeWidth={2.2} />
          </div>
          <div>
            <h1 className="leading-tight" style={{ fontFamily: DISPLAY_FONT, fontWeight: 600, fontSize: "1.35rem", color: PRIMARY_DARK }}>
              Szczotka i Zmiotka
            </h1>
            <p className="text-xs" style={{ color: "#5B6E67" }}>Rejestr zleceń — Vanessa Jamrozik</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-1 rounded-lg border" style={{ borderColor: LINE_COLOR }}>
            <button onClick={() => onYearChange(year - 1)} className="p-1.5 rounded-l-lg hover:bg-gray-50 transition" title="Poprzedni rok">
              <ChevronLeft size={15} color="#5B6E67" />
            </button>
            <span style={{ fontFamily: MONO_FONT, fontWeight: 600, color: PRIMARY_DARK, minWidth: 40, textAlign: "center" }}>{year}</span>
            <button onClick={() => onYearChange(year + 1)} className="p-1.5 rounded-r-lg hover:bg-gray-50 transition" title="Następny rok">
              <ChevronRight size={15} color="#5B6E67" />
            </button>
          </div>
          <span className="hidden sm:flex items-center gap-1 text-xs" style={{ color: saveState === "error" ? CORAL : "#5B6E67" }}>
            {saveState === "saved" && <><Check size={13} /> Zapisano</>}
            {saveState === "saving" && "Zapisywanie…"}
            {saveState === "error" && "Błąd zapisu"}
          </span>
          <button
            onClick={onUndo}
            disabled={undoCount === 0}
            className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border transition hover:bg-gray-50 disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-transparent"
            style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}
            title={undoCount > 0 ? `Cofnij ostatnią zmianę (dostępne: ${undoCount})` : "Brak zmian do cofnięcia"}
          >
            <RotateCcw size={13} /> Cofnij
          </button>
          <button
            onClick={onBackups}
            className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border transition hover:bg-gray-50"
            style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}
            title="Kopie zapasowe"
          >
            <Shield size={13} /> Kopie
          </button>
        </div>
      </div>
    </header>
  );
}

function TabBar({ activeTab, view, year, onSelectMonth, yearData }) {
  const [showPastMonths, setShowPastMonths] = useState(false);
  const now = new Date();
  const isCurrentYear = year === now.getFullYear();
  const currentMonthIdx = now.getMonth();
  const pastMonthsCount = isCurrentYear ? currentMonthIdx : 0;
  const isCollapsed = pastMonthsCount > 0 && !showPastMonths;

  const renderMonthButton = (name, idx) => {
    const isActive = view === "month" && activeTab === idx;
    const zysk = yearData.months[idx]?.zysk ?? 0;
    return (
      <button
        key={name}
        onClick={() => onSelectMonth(idx)}
        className="flex-shrink-0 px-3.5 py-1.5 rounded-lg text-sm font-medium transition whitespace-nowrap flex items-center gap-1.5"
        style={{
          background: isActive ? PRIMARY : "transparent",
          color: isActive ? "white" : "#3F534C",
        }}
      >
        {name}
        {zysk !== 0 && (
          <span
            className="w-1.5 h-1.5 rounded-full"
            style={{ background: isActive ? "white" : zysk > 0 ? PRIMARY : CORAL, opacity: isActive ? 0.8 : 1 }}
          />
        )}
      </button>
    );
  };

  return (
    <div className="sticky top-0 z-20 border-b" style={{ background: SURFACE, borderColor: LINE_COLOR }}>
      <div className="max-w-6xl mx-auto px-4 sm:px-6">
        <div className="flex gap-1 overflow-x-auto py-2" style={{ scrollbarWidth: "thin" }}>
          {pastMonthsCount > 0 && (
            <button
              onClick={() => setShowPastMonths((v) => !v)}
              className="flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium transition whitespace-nowrap flex items-center gap-1"
              style={{ background: "transparent", color: "#8CA098", border: `1px dashed ${LINE_COLOR}` }}
              title={isCollapsed ? "Pokaż poprzednie miesiące" : "Ukryj poprzednie miesiące"}
            >
              <ChevronRight size={13} style={{ transform: isCollapsed ? "none" : "rotate(180deg)" }} />
              {isCollapsed ? "Poprzednie" : "Ukryj"}
            </button>
          )}
          {MONTH_NAMES.map((name, idx) => {
            if (isCollapsed && idx < currentMonthIdx) return null;
            return renderMonthButton(name, idx);
          })}
        </div>
      </div>
    </div>
  );
}

function ActionBar({ view, upcomingCount, overdueCount, completedCount, invoicesCount, onAddClient, onAddPurchase, onAddPrivate, onAddFreeDay, onGoUpcoming, onGoCompleted, onGoFaktury, onGoOverdue, onGoSummary, onGoClients }) {
  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-4">
      <div className="flex gap-2 overflow-x-auto pb-1" style={{ scrollbarWidth: "none", WebkitOverflowScrolling: "touch" }}>
        <button
          onClick={onAddClient}
          className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold text-white transition hover:opacity-90 flex-shrink-0"
          style={{ background: PRIMARY }}
        >
          <Users size={15} /> Zaplanuj zlecenie
        </button>
        <button
          onClick={onAddPurchase}
          className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold text-white transition hover:opacity-90 flex-shrink-0"
          style={{ background: CORAL }}
        >
          <Receipt size={15} /> Zakupy
        </button>
        <button
          onClick={onAddPrivate}
          className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition hover:opacity-90 border flex-shrink-0"
          style={{ background: "#EEEDFE", color: PRIVATE_PURPLE, borderColor: "#CECBF6" }}
        >
          <Clock size={15} /> Termin prywatny
        </button>
        <button
          onClick={onAddFreeDay}
          className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition hover:opacity-90 border flex-shrink-0"
          style={{ background: "#FDF6E9", color: "#8A6A1F", borderColor: "#EED9A8" }}
        >
          <Umbrella size={15} /> Dzień wolny
        </button>
        <span className="w-px my-1" style={{ background: LINE_COLOR }} />
        <button
          onClick={onGoClients}
          className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap flex-shrink-0"
          style={{ background: view === "clients" ? PRIMARY_DARK : "#F0EDE6", color: view === "clients" ? "white" : "#6B5D4A" }}
        >
          <Users size={14} /> Baza klientów
        </button>
        <button
          onClick={onGoUpcoming}
          className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap flex-shrink-0"
          style={{ background: view === "upcoming" ? PRIMARY_DARK : "#EAF1F8", color: view === "upcoming" ? "white" : "#2A5C8A" }}
        >
          <CalendarClock size={14} /> Zaplanowane
          {upcomingCount > 0 && (
            <span
              className="text-[10px] font-bold rounded-full px-1.5 py-0.5"
              style={{ background: view === "upcoming" ? "rgba(255,255,255,0.25)" : "#2A5C8A", color: "white" }}
            >
              {upcomingCount}
            </span>
          )}
        </button>
        {completedCount > 0 && (
          <button
            onClick={onGoCompleted}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap flex-shrink-0"
            style={{ background: view === "wykonane" ? PRIMARY_DARK : MINT, color: view === "wykonane" ? "white" : PRIMARY_DARK }}
          >
            <CheckCircle2 size={14} /> Wykonane
            <span
              className="text-[10px] font-bold rounded-full px-1.5 py-0.5"
              style={{ background: view === "wykonane" ? "rgba(255,255,255,0.25)" : PRIMARY_DARK, color: "white" }}
            >
              {completedCount}
            </span>
          </button>
        )}
        {invoicesCount > 0 && (
          <button
            onClick={onGoFaktury}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap flex-shrink-0"
            style={{ background: view === "faktury" ? GOLD : "#FDF3E0", color: view === "faktury" ? "white" : GOLD }}
          >
            <Receipt size={14} /> Faktury
            <span
              className="text-[10px] font-bold rounded-full px-1.5 py-0.5"
              style={{ background: view === "faktury" ? "rgba(255,255,255,0.25)" : GOLD, color: "white" }}
            >
              {invoicesCount}
            </span>
          </button>
        )}
        {overdueCount > 0 && (
          <button
            onClick={onGoOverdue}
            className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap flex-shrink-0"
            style={{ background: view === "overdue" ? CORAL : "#FCE9E7", color: view === "overdue" ? "white" : CORAL }}
          >
            <AlertTriangle size={14} /> Zaległe
            <span
              className="text-[10px] font-bold rounded-full px-1.5 py-0.5"
              style={{ background: view === "overdue" ? "rgba(255,255,255,0.25)" : CORAL, color: "white" }}
            >
              {overdueCount}
            </span>
          </button>
        )}
        <button
          onClick={onGoSummary}
          className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap flex-shrink-0"
          style={{ background: view === "summary" ? PRIMARY_DARK : MINT, color: view === "summary" ? "white" : PRIMARY_DARK }}
        >
          <TrendingUp size={14} /> Podsumowanie
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* KPI Card                                                             */
/* ------------------------------------------------------------------ */
function KpiCard({ icon: Icon, label, value, accent, onClick }) {
  const clickable = !!onClick;
  return (
    <div
      onClick={onClick}
      className={`rounded-xl p-3.5 flex-1 min-w-[130px] transition ${clickable ? "cursor-pointer hover:shadow-sm hover:-translate-y-0.5" : ""}`}
      style={{ background: SURFACE, border: `1px solid ${clickable ? "#2A5C8A55" : LINE_COLOR}` }}
    >
      <div className="flex items-center gap-1.5 mb-1.5" style={{ color: "#5B6E67" }}>
        <Icon size={13} />
        <span className="text-[11px] font-medium uppercase tracking-wide">{label}</span>
      </div>
      <div style={{ fontFamily: MONO_FONT, fontWeight: 600, fontSize: "1.05rem", color: accent || INK }}>
        {value}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Month View                                                           */
/* ------------------------------------------------------------------ */
function MonthView({ monthName, year, isCurrentMonth, summary, entries, calendarCells, freeDays, detailLists, search, setSearch, searchScope, setSearchScope, isYearSearch, onAddForDay, onEdit, onDelete, onJumpToMonth, onSetStatus, onMarkDone, onMove, onRemoveFreeDay, onEditFreeDay, onMoveFreeDay, onGoUpcoming, onSetPaymentStatus, onToggleInvoice }) {
  const [detail, setDetail] = useState(null); // "zarobki" | "wydatki" | "zaplanowane" | "wolne" | null
  const [dayDetail, setDayDetail] = useState(null); // { dateStr, entries } | null
  const [showPast, setShowPast] = useState(false);

  const today = todayStr();
  const pastCount = isCurrentMonth ? entries.filter((e) => e.data && e.data < today).length : 0;
  const isCollapsed = isCurrentMonth && pastCount > 0 && !search.trim() && !showPast;
  const visibleEntries = isCollapsed ? entries.filter((e) => !e.data || e.data >= today) : entries;

  return (
    <div className="space-y-5">
      <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.6rem", fontWeight: 600, color: PRIMARY_DARK }}>
        {monthName} <span style={{ color: "#8CA098", fontSize: "1.1rem" }}>{year}</span>
      </h2>

      <div className="flex gap-3 flex-wrap">
        <KpiCard icon={Wallet} label="Zlecenia wykonane" value={`${summary.liczbaZlecen} · ${fmtPLN(summary.zarobki)}`} accent={PRIMARY_DARK} onClick={() => setDetail("zarobki")} />
        {summary.zaplanowaneLiczba > 0 && (
          <KpiCard icon={CalendarClock} label="Zaplanowane" value={`${summary.zaplanowaneLiczba} · ${fmtPLN(summary.zaplanowaneZarobki)}`} accent="#2A5C8A" onClick={() => setDetail("zaplanowane")} />
        )}
        {summary.zaległeLiczba > 0 && (
          <KpiCard icon={AlertTriangle} label="Zaległe" value={`${summary.zaległeLiczba} · ${fmtPLN(summary.zaległeZarobki)}`} accent={CORAL} onClick={() => setDetail("zalegle")} />
        )}
        <KpiCard icon={TrendingUp} label="Zysk netto" value={fmtPLN(summary.zysk)} accent={summary.zysk >= 0 ? PRIMARY_DARK : CORAL} />
        <KpiCard icon={Clock} label="Śr. stawka" value={summary.stawka > 0 ? fmtPLN(summary.stawka) + "/h" : "—"} />
        <KpiCard icon={Receipt} label="Wydatki" value={`${detailLists.wydatki.length} · ${fmtPLN(summary.wydatki)}`} accent={CORAL} onClick={() => setDetail("wydatki")} />
        {freeDays.length > 0 && (
          <KpiCard icon={Umbrella} label="Dni wolne" value={freeDays.length} accent="#8A6A1F" onClick={() => setDetail("wolne")} />
        )}
        {detailLists.prywatne.length > 0 && (
          <KpiCard icon={Clock} label="Terminy prywatne" value={detailLists.prywatne.length} accent={PRIVATE_PURPLE} onClick={() => setDetail("prywatne")} />
        )}
        {detailLists.zeStrony.length > 0 && (
          <KpiCard icon={Globe} label="Zapisy ze strony WWW" value={detailLists.zeStrony.length} accent="#1F8A70" onClick={() => setDetail("zeStrony")} />
        )}
        {detailLists.oczekujacePlatnosci.length > 0 && (
          <KpiCard icon={AlertTriangle} label="Oczekujące płatności" value={detailLists.oczekujacePlatnosci.length} accent={CORAL} onClick={() => setDetail("oczekujacePlatnosci")} />
        )}
        {detailLists.fakturyDoWystawienia.length > 0 && (
          <KpiCard icon={Receipt} label="Faktury do wystawienia" value={detailLists.fakturyDoWystawienia.length} accent="#8A6A1F" onClick={() => setDetail("fakturyDoWystawienia")} />
        )}
      </div>

      {!isYearSearch && <CalendarStrip cells={calendarCells} onDayClick={(dateStr) => setDayDetail(dateStr)} />}

      {!isYearSearch && freeDays.length > 0 && (
        <div className="rounded-xl overflow-hidden" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
          <div className="px-4 py-3 border-b flex items-center gap-1.5" style={{ borderColor: LINE_COLOR }}>
            <Umbrella size={13} color="#8A6A1F" />
            <h3 className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#8A6A1F" }}>Dni wolne w tym miesiącu</h3>
          </div>
          <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
            {groupConsecutiveFreeDays(freeDays).map((g) => {
              const isRange = g.startDate !== g.endDate;
              return (
                <div key={g.ids[0]} className="px-4 py-3">
                  <div className="flex items-center gap-3 flex-wrap">
                    <div className="flex-shrink-0" style={{ minWidth: isRange ? 100 : 80 }}>
                      {isRange ? (
                        <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: "#8A6A1F", whiteSpace: "nowrap" }}>
                          {g.startDate.slice(8, 10)}.{g.startDate.slice(5, 7)}–{g.endDate.slice(8, 10)}.{g.endDate.slice(5, 7)}
                        </div>
                      ) : (
                        <>
                          <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: "#8A6A1F" }}>
                            {g.startDate.slice(8, 10)}.{g.startDate.slice(5, 7)}
                          </div>
                          <div className="text-[10px] capitalize" style={{ color: "#8CA098" }}>
                            {weekdayName(g.startDate)}
                          </div>
                        </>
                      )}
                    </div>
                    <div className="flex-1 min-w-[120px] text-sm font-medium truncate" style={{ color: INK }}>{g.opis || "—"}</div>
                    {isRange && (
                      <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full flex-shrink-0" style={{ background: "#FDF6E9", color: "#8A6A1F" }}>
                        {g.ids.length} dni
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-1 mt-2">
                    <button onClick={() => onMoveFreeDay(g)} className="p-1.5 rounded-md border hover:bg-sky-50 transition" style={{ borderColor: LINE_COLOR }} title="Przenieś termin">
                      <Move size={14} color="#2A5C8A" />
                    </button>
                    <button onClick={() => onEditFreeDay(g)} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Edytuj">
                      <Pencil size={14} color="#5B6E67" />
                    </button>
                    <button onClick={() => onRemoveFreeDay(g.ids)} className="p-1.5 rounded-md border hover:bg-red-50 transition" style={{ borderColor: LINE_COLOR }} title="Usuń dzień wolny">
                      <Trash2 size={14} color={CORAL} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {detail && (
        <KpiDetailModal
          type={detail}
          entries={detailLists[detail] || []}
          freeDays={freeDays}
          onEdit={onEdit}
          onDelete={onDelete}
          onSetStatus={onSetStatus}
          onMarkDone={onMarkDone}
          onMove={onMove}
          onEditFreeDay={(g) => { onEditFreeDay(g); setDetail(null); }}
          onMoveFreeDay={(g) => { onMoveFreeDay(g); setDetail(null); }}
          onRemoveFreeDay={onRemoveFreeDay}
          onSetPaymentStatus={onSetPaymentStatus}
          onToggleInvoice={onToggleInvoice}
          onClose={() => setDetail(null)}
        />
      )}

      {dayDetail && (
        <DayDetailModal
          dateStr={dayDetail}
          entries={(calendarCells.find((c) => c && c.dateStr === dayDetail) || {}).entries || []}
          onEdit={(e) => { onEdit(e); setDayDetail(null); }}
          onAddNew={(dateStr) => { onAddForDay(dateStr); setDayDetail(null); }}
          onDelete={onDelete}
          onSetStatus={onSetStatus}
          onMarkDone={(e) => { onMarkDone(e); setDayDetail(null); }}
          onMove={(e) => { onMove(e); setDayDetail(null); }}
          onClose={() => setDayDetail(null)}
        />
      )}


      <div className="flex items-center gap-2 flex-wrap">
        <input
          type="text"
          placeholder="Szukaj po kliencie lub adresie…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          className="w-full sm:w-72 px-3 py-2 rounded-lg text-sm border"
          style={{ borderColor: LINE_COLOR, background: SURFACE }}
        />
        <div className="inline-flex rounded-lg border overflow-hidden flex-shrink-0" style={{ borderColor: LINE_COLOR }}>
          {[{ key: "month", label: "Ten miesiąc" }, { key: "year", label: "Cały rok" }].map((opt) => (
            <button
              key={opt.key}
              onClick={() => setSearchScope(opt.key)}
              className="px-3 py-2 text-xs font-medium transition"
              style={{
                background: searchScope === opt.key ? PRIMARY : "transparent",
                color: searchScope === opt.key ? "white" : "#5B6E67",
              }}
            >
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      {isYearSearch && (
        <p className="text-xs" style={{ color: "#5B6E67" }}>
          Wyniki z całego {year} roku ({entries.length}) — kliknij miesiąc przy wpisie, żeby do niego przejść.
        </p>
      )}

      {pastCount > 0 && !search.trim() && (
        <button
          onClick={() => setShowPast((v) => !v)}
          className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm transition hover:bg-gray-50"
          style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#5B6E67" }}
        >
          <ChevronRight size={15} style={{ transform: isCollapsed ? "rotate(90deg)" : "rotate(-90deg)" }} />
          {isCollapsed ? "Pokaż wcześniejsze zlecenia" : "Ukryj wcześniejsze zlecenia"}
        </button>
      )}

      <EntriesTable entries={visibleEntries} onEdit={onEdit} onDelete={onDelete} showMonth={isYearSearch} onJumpToMonth={onJumpToMonth} onSetStatus={onSetStatus} onMarkDone={onMarkDone} onMove={onMove} />
    </div>
  );
}

function CalendarStrip({ cells, onDayClick }) {
  return (
    <div className="rounded-xl p-4" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      <div className="flex items-center gap-4 mb-3 text-[10px] flex-wrap" style={{ color: "#8CA098" }}>
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm" style={{ background: "rgba(31,110,92,0.55)" }} /> wykonane</span>
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm border" style={{ borderColor: "#2A5C8A", borderStyle: "dashed", background: "#EAF1F8" }} /> zaplanowane</span>
        <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full" style={{ background: CORAL }} /> wydatek</span>
        <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full" style={{ background: PRIVATE_PURPLE }} /> prywatne</span>
        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm" style={{ background: "#FDF6E9", border: "1px solid #EED9A8" }} /> wolne</span>
        <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full" style={{ background: "#E0665A" }} /> święto</span>
      </div>
      <div className="grid grid-cols-7 gap-1.5 mb-1.5">
        {WEEKDAY_LETTERS.map((w) => (
          <div key={w} className="text-center text-[10px] font-semibold uppercase tracking-wide" style={{ color: "#8CA098" }}>{w}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1.5">
        {cells.map((cell, idx) => {
          if (!cell) return <div key={idx} />;
          const activeEntries = cell.entries.filter((e) => e.statusZlecenia !== "Odwołane");
          const doneEntries = activeEntries.filter((e) => e.klient && isRealized(e));
          const plannedEntries = activeEntries.filter((e) => e.statusZlecenia === "Zaplanowane");
          const hasExpense = activeEntries.some((e) => Number(e.wydatki) > 0 && !e.klient && e.typWpisu !== "prywatne");
          const hasPrivate = activeEntries.some((e) => e.typWpisu === "prywatne");
          const allCancelled = cell.entries.length > 0 && cell.entries.every((e) => e.statusZlecenia === "Odwołane");
          const dayZarobki = doneEntries.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
          const intensity = Math.min(1, dayZarobki / 400);
          const isPlannedOnly = plannedEntries.length > 0 && doneEntries.length === 0;
          const isFree = !!cell.freeDay && doneEntries.length === 0 && plannedEntries.length === 0;
          const holidayName = polishHolidayName(cell.dateStr);
          const isSunday = new Date(cell.dateStr + "T00:00:00").getDay() === 0;
          const isSaturday = new Date(cell.dateStr + "T00:00:00").getDay() === 6;
          const isRedDay = !!holidayName || isSunday;
          return (
            <button
              key={idx}
              onClick={() => onDayClick(cell.dateStr, cell.entries)}
              className="aspect-square rounded-lg flex flex-col items-center justify-center relative text-xs transition hover:ring-2"
              style={{
                background: doneEntries.length
                  ? `rgba(31,110,92,${0.15 + intensity * 0.55})`
                  : isPlannedOnly
                  ? "#EAF1F8"
                  : isFree
                  ? "#FDF6E9"
                  : isRedDay ? "#FBEAE7" : isSaturday ? "#F0EDE6" : "#FAFBFA",
                border: isPlannedOnly ? "1px dashed #2A5C8A" : isFree ? "1px solid #EED9A8" : holidayName ? "1.5px solid #E0665A" : allCancelled ? "1px solid #E5E7EB" : "1px solid transparent",
                color: doneEntries.length && intensity > 0.5 ? "white" : isPlannedOnly ? "#2A5C8A" : isFree ? "#8A6A1F" : isRedDay ? "#B23A2E" : allCancelled ? "#B0B8B5" : INK,
                ringColor: PRIMARY,
              }}
              title={holidayName ? `Święto: ${holidayName}${cell.freeDay ? " (oznaczone jako wolne)" : ""}` : cell.freeDay ? `Wolne${cell.freeDay.opis ? ": " + cell.freeDay.opis : ""}` : cell.entries.length ? `${cell.entries.length} wpis(ów)` : "Dodaj wpis"}
            >
              <span style={{ fontFamily: MONO_FONT, fontWeight: 500, textDecoration: allCancelled ? "line-through" : "none" }}>{cell.day}</span>
              <span className="absolute bottom-1 flex items-center gap-0.5">
                {hasExpense && <span className="w-1 h-1 rounded-full" style={{ background: CORAL }} />}
                {hasPrivate && <span className="w-1 h-1 rounded-full" style={{ background: PRIVATE_PURPLE }} />}
              </span>
              {isFree && <Umbrella size={9} className="absolute bottom-1" />}
              {holidayName && !isFree && <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full" style={{ background: "#E0665A" }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function EntriesTable({ entries, onEdit, onDelete, showMonth, onJumpToMonth, onSetStatus, onMarkDone, onMove }) {
  if (entries.length === 0) {
    return (
      <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
        {showMonth ? "Brak wyników dla podanej frazy w całym roku." : "Brak wpisów w tym miesiącu. Kliknij dzień w kalendarzu albo „Dodaj wpis”, żeby zacząć."}
      </div>
    );
  }
  return (
    <div className="rounded-xl overflow-hidden divide-y" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      {entries.map((e) => {
        const entryMonth = e.data ? new Date(e.data + "T00:00:00").getMonth() : null;
        const orderStatus = e.statusZlecenia || "Wykonane";
        const isCancelled = orderStatus === "Odwołane";
        const isPlanned = orderStatus === "Zaplanowane";
        const isOverdue = isPlanned && e.data && e.data < todayStr();
        const isPrivate = e.typWpisu === "prywatne";
        const isZakup = !isPrivate && !e.klient && (e.opisWydatkow || e.wydatki);
        const title = e.klient || e.opisWydatkow || "—";
        const amount = isZakup ? Number(e.wydatki) || 0 : isPrivate ? Number(e.wydatki) || 0 : Number(e.zarobki) || 0;
        const accentClr = isZakup ? CORAL : isPrivate ? PRIVATE_PURPLE : PRIMARY_DARK;
        const secondaryParts = isZakup
          ? [e.kategoria ? `Kategoria: ${e.kategoria}` : null]
          : isPrivate
          ? [e.adres, e.godziny ? fmtNum(e.godziny, "h") : null]
          : [e.adres, e.opisUslugi];
        const secondary = secondaryParts.filter(Boolean).join(" · ") || "—";
        const statusBadge = ORDER_STATUS_BADGE[isOverdue ? "Zaległe" : orderStatus] || ORDER_STATUS_BADGE["Wykonane"];
        const isToday = e.data === todayStr();
        return (
          <div
            key={e.id}
            className="px-4 py-3"
            style={{
              borderColor: LINE_COLOR,
              opacity: isCancelled ? 0.6 : 1,
              background: isToday ? "#EAF3DE" : "transparent",
              borderLeft: isToday ? `3px solid ${PRIMARY}` : "3px solid transparent",
            }}
          >
            <div className="flex items-center gap-3 flex-wrap">
              <div className="w-20 flex-shrink-0">
                <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: isToday ? PRIMARY_DARK : accentClr }}>
                  {e.data ? e.data.slice(8, 10) + "." + e.data.slice(5, 7) : "—"}
                </div>
                <div className="text-[10px] capitalize" style={{ color: isToday ? PRIMARY_DARK : "#8CA098", fontWeight: isToday ? 600 : 400 }}>
                  {isToday ? "Dziś" : e.data ? weekdayName(e.data) : ""}{e.godzinaStart ? ` · ${e.godzinaStart}` : ""}
                </div>
              </div>
              <button onClick={() => onEdit(e)} className="flex-1 min-w-[160px] text-left hover:opacity-80 transition">
                <div className="text-sm font-medium truncate" style={{ color: isZakup ? CORAL : isPrivate ? PRIVATE_PURPLE : INK }}>{title}</div>
                <div className="text-xs truncate" style={{ color: "#5B6E67" }}>{secondary}</div>
              </button>
              <div className="text-sm font-semibold flex-shrink-0" style={{ fontFamily: MONO_FONT, color: accentClr, minWidth: 90, textAlign: "right" }}>
                {(isZakup || (isPrivate && amount)) ? "-" : ""}{amount ? fmtPLN(amount) : "—"}
              </div>
              <span className="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full flex-shrink-0" style={{ background: statusBadge.bg, color: statusBadge.color }}>
                <statusBadge.Icon size={10} /> {isOverdue ? "Zaległe" : orderStatus}
              </span>
              {e.status && (
                <span className={`text-[11px] px-2 py-0.5 rounded-full border flex-shrink-0 ${STATUS_STYLES[e.status] || ""}`}>{e.status}</span>
              )}
              {showMonth && entryMonth !== null && (
                <button
                  onClick={() => onJumpToMonth(entryMonth)}
                  className="text-[11px] px-2 py-0.5 rounded-full font-medium transition hover:opacity-80 flex-shrink-0"
                  style={{ background: MINT, color: PRIMARY_DARK }}
                >
                  {MONTH_NAMES[entryMonth]}
                </button>
              )}
            </div>
            <div className="flex items-center gap-1 mt-2">
              {isPlanned && (
                <button onClick={() => onMarkDone(e)} className="p-1.5 rounded-md border hover:bg-emerald-50 transition" style={{ borderColor: LINE_COLOR }} title="Oznacz jako wykonane">
                  <CheckCircle2 size={15} color={PRIMARY} />
                </button>
              )}
              {!isZakup && !isCancelled && (
                <button onClick={() => onSetStatus(e.id, "Odwołane")} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Odwołaj zlecenie">
                  <Ban size={15} color="#8CA098" />
                </button>
              )}
              {!isCancelled && (
                <button onClick={() => onMove(e)} className="p-1.5 rounded-md border hover:bg-sky-50 transition" style={{ borderColor: LINE_COLOR }} title="Przenieś termin">
                  <Move size={14} color="#2A5C8A" />
                </button>
              )}
              <button onClick={() => onEdit(e)} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Edytuj">
                <Pencil size={14} color="#5B6E67" />
              </button>
              <button onClick={() => onDelete(e.id)} className="p-1.5 rounded-md border hover:bg-red-50 transition" style={{ borderColor: LINE_COLOR }} title="Usuń">
                <Trash2 size={14} color={CORAL} />
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Summary View                                                         */
/* ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ */
/* Upcoming View — planowanie i nadzór przyszłych zleceń                */
/* ------------------------------------------------------------------ */
function OverdueView({ overdue, entries, onEdit, onDelete, onSetStatus, onMarkDone, onMove, onAddForDay, onJumpToMonth }) {
  const totalValue = overdue.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
  const [dayDetail, setDayDetail] = useState(null); // dateStr | null
  const [detail, setDetail] = useState(null); // "zalegle" | null

  const monthGroups = useMemo(() => {
    const groups = {};
    overdue.forEach((e) => {
      if (!e.data) return;
      const key = e.data.slice(0, 7); // "YYYY-MM"
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    return Object.keys(groups).sort().map((key) => {
      const [y, m] = key.split("-").map(Number);
      return { year: y, month: m - 1, entries: groups[key] };
    });
  }, [overdue]);

  return (
    <div className="space-y-6">
      <h2 className="flex items-center gap-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.6rem", fontWeight: 600, color: CORAL }}>
        <AlertTriangle size={22} /> Zaległe zlecenia
      </h2>

      <div className="flex gap-3 flex-wrap">
        <KpiCard icon={AlertTriangle} label="Zaległe" value={overdue.length} accent={CORAL} onClick={() => setDetail("zalegle")} />
        <KpiCard icon={Wallet} label="Wartość zaległych" value={fmtPLN(totalValue)} accent={CORAL} onClick={() => setDetail("zalegle")} />
      </div>

      {overdue.length === 0 ? (
        <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
          Brak zaległych zleceń — wszystko na bieżąco. 🎉
        </div>

function MiniMonthCalendar({ year, month, entries, onDayClick, tone = "planned" }) {
  const cells = useMemo(() => {
    const first = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startOffset = (first.getDay() + 6) % 7;
    const byDay = {};
    entries.forEach((e) => {
      const d = Number(e.data.slice(8, 10));
      if (!byDay[d]) byDay[d] = [];
      byDay[d].push(e);
    });
    const list = [];
    for (let i = 0; i < startOffset; i++) list.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      list.push({ day: d, dateStr, entries: byDay[d] || [] });
    }
    return list;
  }, [year, month, entries]);

  return (
    <div className="rounded-xl p-4 flex-1 min-w-[280px]" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      <h3 className="text-sm font-semibold mb-3" style={{ color: PRIMARY_DARK }}>
        {MONTH_NAMES[month]} <span style={{ color: "#8CA098", fontWeight: 400 }}>{year}</span>
      </h3>
      <div className="grid grid-cols-7 gap-1 mb-1">
        {WEEKDAY_LETTERS.map((w) => (
          <div key={w} className="text-center text-[9px] font-semibold uppercase" style={{ color: "#8CA098" }}>{w}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((cell, idx) => {
          if (!cell) return <div key={idx} />;
          const hasEntries = cell.entries.length > 0;
          const isOverdue = tone === "planned" && hasEntries && cell.dateStr < todayStr();
          const isToday = cell.dateStr === todayStr();
          const doneStyle = tone === "done" && hasEntries;
          const holidayName = polishHolidayName(cell.dateStr);
          return (
            <button
              key={idx}
              onClick={() => onDayClick(cell.dateStr)}
              className="aspect-square rounded-md flex items-center justify-center text-[11px] transition hover:opacity-70"
              style={{
                background: isOverdue ? "#FDECEA" : doneStyle ? "rgba(31,110,92,0.12)" : hasEntries ? "#EAF1F8" : "transparent",
                border: isOverdue ? "1px dashed #E0665A" : doneStyle ? "1px solid rgba(31,110,92,0.4)" : hasEntries ? "1px dashed #2A5C8A" : holidayName ? "1px solid #E0665A" : isToday ? "1px solid #2A5C8A" : "1px solid transparent",
                color: isOverdue ? CORAL : doneStyle ? PRIMARY_DARK : hasEntries ? "#2A5C8A" : holidayName ? "#B23A2E" : isToday ? "#2A5C8A" : "#B0B8B5",
                fontFamily: MONO_FONT,
                fontWeight: hasEntries || isToday || holidayName ? 600 : 400,
                cursor: "pointer",
              }}
              title={holidayName ? `Święto: ${holidayName}` : hasEntries ? `${cell.entries.length} ${tone === "done" ? "wykonane" : "zaplanowane"}` : "Kliknij, żeby zaplanować zlecenie"}
            >
              {cell.day}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ClientsView({ clients, entries, search, setSearch, onAdd, onEdit, onDelete, onAddOrder }) {
  const stats = useMemo(() => {
    const map = {};
    (entries || []).forEach((e) => {
      if (!e.klient || !e.klient.trim()) return;
      if (!map[e.klient]) map[e.klient] = { zarobki: 0, liczba: 0 };
      if (isRealized(e)) map[e.klient].zarobki += Number(e.zarobki) || 0;
      map[e.klient].liczba += 1;
    });
    return map;
  }, [entries]);

  const filtered = clients
    .filter((c) => {
      if (!search.trim()) return true;
      const s = search.toLowerCase();
      return c.name.toLowerCase().includes(s) || (c.adres || "").toLowerCase().includes(s);
    })
    .sort((a, b) => a.name.localeCompare(b.name, "pl"));

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h2 style={{ fontFamily: DISPLAY_FONT, fontSize: "1.6rem", fontWeight: 600, color: PRIMARY_DARK }}>
          Baza klientów
        </h2>
        <button
          onClick={onAdd}
          className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold text-white transition hover:opacity-90"
          style={{ background: PRIMARY }}
        >
          <Plus size={15} /> Dodaj klienta
        </button>
      </div>

      <input
        type="text"
        placeholder="Szukaj po nazwie lub adresie…"
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        className="w-full sm:w-80 px-3 py-2 rounded-lg text-sm border"
        style={{ borderColor: LINE_COLOR, background: SURFACE }}
      />

      {filtered.length === 0 ? (
        <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
          {clients.length === 0 ? "Brak klientów w bazie. Dodaj pierwszego, żeby móc go wybierać z listy przy planowaniu zleceń." : "Brak wyników dla podanej frazy."}
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {filtered.map((c) => {
            const s = stats[c.name] || { zarobki: 0, liczba: 0 };
            return (
              <div key={c.id} className="rounded-xl p-4 flex flex-col gap-2" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <div className="font-semibold" style={{ color: INK }}>{c.name}</div>
                    {c.adres && <div className="text-xs" style={{ color: "#8CA098" }}>{c.adres}</div>}
                  </div>
                  <div className="flex items-center gap-1 flex-shrink-0">
                    <button onClick={() => onAddOrder(c)} className="p-1.5 rounded-md border hover:bg-emerald-50 transition" style={{ borderColor: LINE_COLOR }} title="Zaplanuj zlecenie dla tego klienta">
                      <CalendarClock size={14} color={PRIMARY} />
                    </button>
                    <button onClick={() => onEdit(c)} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Edytuj">
                      <Pencil size={14} color="#5B6E67" />
                    </button>
                    <button onClick={() => onDelete(c.id)} className="p-1.5 rounded-md border hover:bg-red-50 transition" style={{ borderColor: LINE_COLOR }} title="Usuń">
                      <Trash2 size={14} color={CORAL} />
                    </button>
                  </div>
                </div>
                <div className="flex items-center gap-3 text-xs" style={{ color: "#5B6E67" }}>
                  {c.telefon && <span>📞 {c.telefon}</span>}
                  {c.typKlienta && (
                    <span className="px-2 py-0.5 rounded-full" style={{ background: MINT, color: PRIMARY_DARK }}>{c.typKlienta}</span>
                  )}

                    <span className="flex items-center gap-1 px-2 py-0.5 rounded-full" style={{ background: "#FDF3E0", color: GOLD }}>

                  <div className="text-xs pt-1 border-t" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>

                  </div>

          <div className="grid grid-cols-2 gap-3">
            <FormField label="Telefon">
              <input type="tel" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.telefon} onChange={(e) => onChange("telefon", e.target.value)} placeholder="np. 600 123 456" />
            </FormField>
            <FormField label="Typ klienta">
              <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.typKlienta} onChange={(e) => onChange("typKlienta", e.target.value)}>
                <option value="">—</option>
                {CLIENT_TYPES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </FormField>
          </div>
          <FormField label="Faktura VAT">
            <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.fakturaVat ? "tak" : "nie"} onChange={(e) => onChange("fakturaVat", e.target.value === "tak")}>
              <option value="nie">Nie</option>
              <option value="tak">Tak</option>
            </select>
          </FormField>
          <FormField label="Uwagi">
            <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 60 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} placeholder="np. kod do domofonu, ma psa…" />
          </FormField>
        </div>
        <div className="flex gap-2 px-5 py-4 border-t" style={{ borderColor: LINE_COLOR }}>
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={onSave}
            disabled={!form.name.trim()}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
            style={{ background: PRIMARY }}
          >
            Zapisz
          </button>
        </div>
      </div>
    </div>
  );
}

function FakturyView({ data, year, onEdit, onToggleInvoice, onSetPaymentStatus }) {
  const [expanded, setExpanded] = useState(null); // "monthIdx-klient" | null
  const [monthIdx, setMonthIdx] = useState(() => {
    const now = new Date();
    return now.getFullYear() === year ? now.getMonth() : 0;
  });

  const activeMonth = data.months.find((m) => m.monthIdx === monthIdx) || null;
  const monthClients = activeMonth ? activeMonth.clients : [];
  const monthCount = monthClients.reduce((s, c) => s + c.count, 0);

  return (
    <div className="space-y-6">
      <h2 className="flex items-center gap-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.6rem", fontWeight: 600, color: GOLD }}>
        <Receipt size={22} /> Faktury VAT <span style={{ color: "#8CA098", fontSize: "1.1rem" }}>{year}</span>
      </h2>

      <div className="flex gap-3 flex-wrap">
        <KpiCard icon={Receipt} label="Do wystawienia" value={`${data.pendingCount} · ${fmtPLN(data.pendingValue)}`} accent={GOLD} />
        <KpiCard icon={CheckCircle2} label="Wystawione" value={`${data.issuedCount} · ${fmtPLN(data.issuedValue)}`} accent={PRIMARY_DARK} />
      </div>

      {data.months.length === 0 ? (
        <div className="rounded-xl p-10 text-center" style={{ background: SURFACE, border: `1px dashed ${LINE_COLOR}`, color: "#8CA098" }}>
          Brak zleceń oznaczonych „Potrzebna Faktura VAT" w {year} roku.
        </div>
      ) : (
        <InvoicesSection
          monthIdx={monthIdx}
          onPrevMonth={() => setMonthIdx((m) => Math.max(0, m - 1))}
          onNextMonth={() => setMonthIdx((m) => Math.min(11, m + 1))}
          clients={monthClients}
          monthCount={monthCount}
          onEdit={onEdit}
          onToggleInvoice={onToggleInvoice}
          onSetPaymentStatus={onSetPaymentStatus}
          expanded={expanded}
          setExpanded={setExpanded}
        />
      )}
    </div>
  );
}

function InvoicesSection({ monthIdx, onPrevMonth, onNextMonth, clients, monthCount, onEdit, onToggleInvoice, onSetPaymentStatus, expanded, setExpanded }) {
  return (
    <div className="rounded-xl" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}` }}>
      <div className="px-4 py-3 border-b flex items-center gap-2 rounded-t-xl flex-wrap" style={{ borderColor: LINE_COLOR }}>
        <Receipt size={16} color={GOLD} />
        <h3 className="text-sm font-semibold" style={{ color: PRIMARY_DARK }}>
          Faktury VAT <span style={{ color: "#8CA098", fontWeight: 400 }}>({monthCount} {monthCount === 1 ? "zlecenie" : "zleceń"})</span>
        </h3>
        <div className="flex items-center gap-2 ml-auto">
          <button onClick={onPrevMonth} disabled={monthIdx === 0} className="p-1 rounded-md border disabled:opacity-30 hover:bg-gray-50 transition" style={{ borderColor: LINE_COLOR }}>
            <ChevronLeft size={15} color={PRIMARY_DARK} />
          </button>
          <span className="text-sm font-semibold min-w-[90px] text-center" style={{ color: PRIMARY_DARK, fontFamily: DISPLAY_FONT }}>{MONTH_NAMES[monthIdx]}</span>
          <button onClick={onNextMonth} disabled={monthIdx === 11} className="p-1 rounded-md border disabled:opacity-30 hover:bg-gray-50 transition" style={{ borderColor: LINE_COLOR }}>
            <ChevronRight size={15} color={PRIMARY_DARK} />
          </button>
        </div>
      </div>
      {clients.length === 0 ? (
        <div className="px-4 py-10 text-center text-sm" style={{ color: "#8CA098" }}>
          Brak faktur w tym miesiącu.
        </div>
      ) : (
      <div style={{ borderColor: LINE_COLOR }}>
        <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
            {clients.map((c, cIdx) => {
              const key = `${monthIdx}-${c.klient}`;
              const isExpanded = expanded === key;
              const allIssued = c.issuedCount === c.count;
              const noneIssued = c.issuedCount === 0;
              const paymentStatuses = new Set(c.entries.map((e) => e.status || ""));
              const uniformStatus = paymentStatuses.size === 1 ? c.entries[0].status : null;
              const zebraBg = cIdx % 2 === 1 ? "#F4F6F2" : "transparent";
              return (
                <div key={key} style={{ background: zebraBg }}>
                  <div
                    onClick={() => setExpanded(isExpanded ? null : key)}
                    role="button"
                    tabIndex={0}
                    className="w-full flex items-center gap-3 px-4 py-2.5 text-left hover:bg-gray-50 transition flex-wrap cursor-pointer"
                  >
                    <div className="flex-1 min-w-[100px] text-sm font-medium">{c.klient}</div>
                    <div className="text-xs" style={{ color: "#8CA098" }}>
                      {c.count} {c.count === 1 ? "zlecenie" : "zleceń"}
                    </div>
                    {c.count === 1 ? (
                      <InvoiceStatusToggle issued={allIssued} onClick={(ev) => { ev.stopPropagation(); onToggleInvoice(c.entries[0].id); }} />
                    ) : (
                      <span
                        className="flex-shrink-0 inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full"
                        style={allIssued ? { background: "#E4F3EC", color: PRIMARY_DARK } : noneIssued ? { background: "#FDF6E9", color: "#8A6A1F" } : { background: "#EAF1F8", color: "#2A5C8A" }}
                      >
                        {allIssued ? <><CheckCircle2 size={11} /> Wystawione</> : <><Clock size={11} /> {c.issuedCount}/{c.count} wystawione</>}
                      </span>
                    )}
                    {c.count === 1 ? (
                      <PaymentStatusMenu status={c.entries[0].status} onChange={(s) => onSetPaymentStatus(c.entries[0].id, s)} />
                    ) : uniformStatus ? (
                      <span className={`flex-shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded-full border ${STATUS_STYLES[uniformStatus] || ""}`}>
                        {uniformStatus}
                      </span>
                    ) : (
                      <span className="flex-shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{ background: "#F1EFE8", color: "#5F5E5A" }}>
                        Różne statusy
                      </span>
                    )}
                    <div style={{ fontFamily: MONO_FONT, fontWeight: 700, color: GOLD, minWidth: 90, textAlign: "right" }}>
                      {fmtPLN(c.total)}
                    </div>
                  </div>
                  {isExpanded && (
                    <div className="pl-4 pb-2">
                      {c.entries.sort(compareEntries).map((e, eIdx) => (
                        <div
                          key={e.id}
                          className="flex items-center gap-3 px-4 py-1.5 text-xs rounded-lg flex-wrap"
                          style={{ color: "#5B6E67", borderTop: eIdx > 0 ? `1px dashed ${LINE_COLOR}` : "none" }}
                        >
                          <button onClick={() => onEdit && onEdit(e)} className="flex items-center gap-3 flex-1 min-w-[100px] text-left hover:opacity-70 transition overflow-hidden">
                            <span style={{ fontFamily: MONO_FONT, minWidth: 44, flexShrink: 0 }}>{e.data.slice(8, 10)}.{e.data.slice(5, 7)}</span>
                            <span className="flex-1 truncate">{e.opisUslugi || "—"}</span>
                            <span style={{ fontFamily: MONO_FONT, fontWeight: 600, color: PRIMARY_DARK, flexShrink: 0, whiteSpace: "nowrap" }}>{fmtPLN(Number(e.zarobki) || 0)}</span>
                          </button>
                          <InvoiceStatusToggle issued={!!e.fakturaWystawiona} onClick={() => onToggleInvoice(e.id)} small />
                          <PaymentStatusMenu status={e.status} onChange={(s) => onSetPaymentStatus(e.id, s)} small />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
      </div>
      )}
    </div>
  );
}

function PaymentStatusMenu({ status, onChange, small }) {
  const [open, setOpen] = useState(false);
  const cls = STATUS_STYLES[status] || "bg-gray-50 text-gray-500 border-gray-200";
  const fontSize = small ? "10px" : "11px";
  const pad = small ? "2px 7px" : "3px 9px";
  return (
    <div className="relative flex-shrink-0" onClick={(ev) => ev.stopPropagation()}>
      <button
        onClick={() => setOpen((v) => !v)}
        className={`inline-flex items-center gap-1 font-semibold rounded-full border transition hover:opacity-80 ${cls}`}
        style={{ fontSize, padding: pad }}
      >
        {status || "—"}
        <span style={{ fontSize: "9px", opacity: 0.7 }}>▾</span>
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => setOpen(false)} />
          <div className="absolute right-0 top-full mt-1 z-20 rounded-lg overflow-hidden" style={{ background: SURFACE, border: `1px solid ${LINE_COLOR}`, minWidth: 116, boxShadow: "0 4px 16px rgba(28,43,39,0.12)" }}>
            {STATUSES.map((s) => (
              <button
                key={s}
                onClick={() => { onChange(s); setOpen(false); }}
                className="flex items-center justify-between gap-2 w-full text-left px-3 py-2 text-xs hover:bg-gray-50 transition"
                style={{ background: s === status ? "#F3F4EE" : "transparent", color: INK }}
              >
                {s}
                {s === status && <Check size={11} color={PRIMARY} />}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function InvoiceStatusToggle({ issued, onClick, small }) {
  const dot = small ? 12 : 14;
  const fontSize = small ? "10px" : "12px";
  const pad = small ? "1.5px 8px 1.5px 5px" : "3.5px 10px 3.5px 6px";
  const issuedColor = { bg: "#E4F3EC", border: "#639922", text: PRIMARY_DARK };
  const pendingColor = { bg: "#FDF6E9", border: "#EF9F27", text: "#8A6A1F" };
  const c = issued ? issuedColor : pendingColor;
  return (
    <button
      onClick={onClick}
      className="flex-shrink-0 inline-flex items-center gap-1.5 font-semibold rounded-full transition hover:opacity-80"
      style={{ background: c.bg, color: c.text, border: `1px solid ${c.border}`, fontSize, padding: pad }}
    >
      <span
        className="flex-shrink-0 flex items-center justify-center rounded-full"
        style={{
          width: dot, height: dot,
          border: issued ? "none" : `1.5px solid ${c.text}`,
          background: issued ? c.border : "transparent",
        }}
      >
        {issued && <Check size={dot - 5} color="white" strokeWidth={3.5} />}
      </span>
      {issued ? "Wystawiona" : "Do wystawienia"}
    </button>
  );
}

              {(formType === "full" || isEditing) && (
                <FormField label="Typ klienta">

              )}

                <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.status} onChange={(e) => onChange("status", e.target.value)}>

                    <Check size={12} color="white" strokeWidth={3} />

                ) : (
                  <span className="flex-shrink-0 rounded-full" style={{ width: 20, height: 20, border: `1.5px solid ${LINE_COLOR}` }} />

              </button>

              {formType === "full" && (
                <FormField label="Uwagi (zlecenie)">
                  <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 50 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
                </FormField>
              )}
            </>
          )}

          {showPrivateFields && (
            <>
              <FormField label="Status">
                <div className="flex gap-2 w-full">
                  {ORDER_STATUSES.map((s) => (
                    <button
                      key={s}
                      type="button"
                      onClick={() => onChange("statusZlecenia", s)}
                      className="flex-1 px-2 py-2.5 text-xs font-medium rounded-full border transition"
                      style={{
                        background: form.statusZlecenia === s ? (s === "Zaplanowane" ? "#2A5C8A" : s === "Odwołane" ? "#8CA098" : PRIMARY) : "transparent",
                        borderColor: form.statusZlecenia === s ? (s === "Zaplanowane" ? "#2A5C8A" : s === "Odwołane" ? "#8CA098" : PRIMARY) : LINE_COLOR,
                        color: form.statusZlecenia === s ? "white" : "#5B6E67",
                      }}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </FormField>

              <FormField label="Nazwa">
                <input type="text" autoFocus className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.opisWydatkow} onChange={(e) => onChange("opisWydatkow", e.target.value)} placeholder="np. Fryzjer — Ania" />
              </FormField>

              <div className="grid grid-cols-2 gap-3">
                <FormField label="Godzina">
                  <input type="time" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.godzinaStart} onChange={(e) => onChange("godzinaStart", e.target.value)} />
                </FormField>
                <FormField label="Czas trwania (h)">
                  <input type="number" step="0.5" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.godziny} onChange={(e) => onChange("godziny", e.target.value)} placeholder="np. 1" />
                </FormField>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <FormField label="Miejsce">
                  <input type="text" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.adres} onChange={(e) => onChange("adres", e.target.value)} placeholder="np. ul. Kwiatowa 4" />
                </FormField>
                <FormField label="Koszt (zł)">
                  <input type="number" step="0.01" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.wydatki} onChange={(e) => onChange("wydatki", e.target.value)} />
                </FormField>
              </div>

              <FormField label="Notatka">
                <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 50 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
              </FormField>
            </>
          )}

          {showZakupFields && (
            <>
              {formType === "full" && (
                <div className="flex items-center gap-2 pt-2">
                  <Receipt size={14} color={CORAL} />
                  <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: CORAL }}>Zakupy</span>
                  <span className="flex-1 h-px" style={{ background: LINE_COLOR }} />
                </div>
              )}

              <FormField label="Opis wydatków">
                <input type="text" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.opisWydatkow} onChange={(e) => onChange("opisWydatkow", e.target.value)} placeholder="np. Płyny, paliwo…" autoFocus={formType === "zakup"} />
              </FormField>

              <div className="grid grid-cols-2 gap-3">
                <FormField label="Kwota (zł)">
                  <input type="number" step="0.01" className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.wydatki} onChange={(e) => onChange("wydatki", e.target.value)} />
                </FormField>
                <FormField label="Kategoria wydatku">
                  <select className={inputCls} style={{ borderColor: LINE_COLOR }} value={form.kategoria} onChange={(e) => onChange("kategoria", e.target.value)}>
                    <option value="">—</option>
                    {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                </FormField>
              </div>

              <FormField label={formType === "full" ? "Uwagi (zakupy)" : "Uwagi"}>
                <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 50 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
              </FormField>
            </>
          )}

          {formType === "klient" && (
            <FormField label="Uwagi">
              <textarea className={inputCls} style={{ borderColor: LINE_COLOR, minHeight: 60 }} value={form.uwagi} onChange={(e) => onChange("uwagi", e.target.value)} />
            </FormField>
          )}
        </div>

        <div className="sticky bottom-0 flex gap-2 px-5 py-4 border-t" style={{ background: SURFACE, borderColor: LINE_COLOR }}>
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={onSave}
            disabled={!form.data}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
            style={{ background: accentColor }}
          >
            {isEditing ? "Zapisz zmiany" : formType === "zakup" ? "Dodaj zakup" : formType === "prywatne" ? "Dodaj termin" : "Zaplanuj zlecenie"}
          </button>
        </div>
      </div>
    </div>
  );
}
