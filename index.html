  wydatki: { title: "Wydatki", icon: Receipt, color: CORAL, empty: "Brak wydatków w tym miesiącu." },
  zaplanowane: { title: "Zaplanowane zlecenia", icon: CalendarClock, color: "#2A5C8A", empty: "Brak zaplanowanych zleceń w tym miesiącu." },
  zalegle: { title: "Zaległe zlecenia", icon: AlertTriangle, color: CORAL, empty: "Brak zaległych zleceń w tym miesiącu." },
  wolne: { title: "Dni wolne", icon: Umbrella, color: "#8A6A1F", empty: "Brak dni wolnych w tym miesiącu." },
  prywatne: { title: "Terminy prywatne", icon: Clock, color: PRIVATE_PURPLE, empty: "Brak terminów prywatnych w tym miesiącu." },
  zeStrony: { title: "Zapisy ze strony WWW", icon: Globe, color: "#1F8A70", empty: "Brak zapisów ze strony WWW w tym miesiącu." },
  oczekujacePlatnosci: { title: "Oczekujące płatności", icon: AlertTriangle, color: CORAL, empty: "Brak oczekujących płatności w tym miesiącu." },
  fakturyDoWystawienia: { title: "Faktury do wystawienia", icon: Receipt, color: "#8A6A1F", empty: "Brak faktur do wystawienia w tym miesiącu." },
};

const ORDER_STATUS_BADGE = {
  "Zaplanowane": { bg: "#EAF1F8", color: "#2A5C8A", Icon: CalendarClock },
  "Wykonane": { bg: "#E4F3EC", color: PRIMARY_DARK, Icon: CheckCircle2 },
  "Odwołane": { bg: "#F1F1EF", color: "#8CA098", Icon: Ban },
  "Zaległe": { bg: "#FCE9E7", color: CORAL, Icon: AlertTriangle },
};

function DayDetailModal({ dateStr, entries, onEdit, onAddNew, onDelete, onSetStatus, onMarkDone, onMove, onClose }) {
  const sorted = entries.slice().sort(compareEntries);
  const dateLabel = dateStr ? `${dateStr.slice(8, 10)}.${dateStr.slice(5, 7)}.${dateStr.slice(0, 4)}` : "";

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full sm:max-w-lg max-h-[85vh] flex flex-col rounded-t-2xl sm:rounded-2xl" style={{ background: SURFACE }}>
        <div className="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style={{ borderColor: LINE_COLOR }}>
          <h3 className="flex items-center gap-2 capitalize" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", fontWeight: 600, color: PRIMARY_DARK }}>
            {dateStr && weekdayName(dateStr)}, {dateLabel}
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>

        <div className="overflow-y-auto flex-1">
          {sorted.length === 0 ? (
            <div className="p-8 text-center text-sm" style={{ color: "#8CA098" }}>Brak wpisów tego dnia.</div>
          ) : (
            <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
              {sorted.map((e) => {
                const isPrivate = e.typWpisu === "prywatne";
                const isZakup = !isPrivate && !e.klient && e.opisWydatkow;
                const isCancelled = e.statusZlecenia === "Odwołane";
                const isPlanned = e.statusZlecenia === "Zaplanowane";
                const isOverdue = isPlanned && e.data && e.data < todayStr();
                const statusLabel = isOverdue ? "Zaległe" : e.statusZlecenia;
                const badge = !isZakup ? ORDER_STATUS_BADGE[statusLabel] || ORDER_STATUS_BADGE["Wykonane"] : null;
                const accentClr = isZakup ? CORAL : isPrivate ? PRIVATE_PURPLE : PRIMARY_DARK;
                return (
                  <div key={e.id} className="flex items-center gap-3 px-5 py-3 flex-wrap">
                    <div style={{ fontFamily: MONO_FONT, fontSize: "0.8rem", color: "#8CA098", minWidth: 44 }}>
                      {e.godzinaStart || "—"}
                    </div>
                    <button onClick={() => onEdit(e)} className="flex-1 min-w-[120px] text-left hover:opacity-70 transition">
                      <div className="text-sm font-medium truncate" style={{ color: isPrivate ? PRIVATE_PURPLE : INK }}>{e.klient || e.opisWydatkow || "—"}</div>
                      {(e.adres || e.opisUslugi) && <div className="text-xs truncate" style={{ color: "#8CA098" }}>{e.adres || e.opisUslugi}</div>}
                    </button>
                    {badge && (
                      <span className="flex-shrink-0 inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{ background: badge.bg, color: badge.color }}>
                        <badge.Icon size={9} /> {statusLabel}
                      </span>
                    )}
                    <div style={{ fontFamily: MONO_FONT, fontWeight: 600, color: accentClr, flexShrink: 0, minWidth: 64, textAlign: "right" }}>
                      {(() => { const amt = Number(isZakup || isPrivate ? e.wydatki : e.zarobki) || 0; return amt ? fmtPLN(amt) : "—"; })()}
                    </div>
                    <div className="flex items-center gap-0.5 flex-shrink-0 ml-auto">
                      {isPlanned && (
                        <button onClick={() => onMarkDone(e)} className="p-1.5 rounded-md border hover:bg-emerald-50 transition" style={{ borderColor: LINE_COLOR }} title="Oznacz jako wykonane">
                          <CheckCircle2 size={15} color={PRIMARY} />
                        </button>
                      )}
                      {!isZakup && !isCancelled && (
                        <button onClick={() => onSetStatus(e.id, "Odwołane")} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Odwołaj zlecenie">
                          <Ban size={15} color="#8CA098" />
                        </button>
                      )}
                      {!isCancelled && (
                        <button onClick={() => onMove(e)} className="p-1.5 rounded-md border hover:bg-sky-50 transition" style={{ borderColor: LINE_COLOR }} title="Przenieś termin">
                          <Move size={14} color="#2A5C8A" />
                        </button>
                      )}
                      <button onClick={() => onEdit(e)} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Edytuj">
                        <Pencil size={14} color="#5B6E67" />
                      </button>
                      <button onClick={() => onDelete(e.id)} className="p-1.5 rounded-md border hover:bg-red-50 transition" style={{ borderColor: LINE_COLOR }} title="Usuń">
                        <Trash2 size={14} color={CORAL} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="flex gap-2 px-5 py-4 border-t flex-shrink-0" style={{ borderColor: LINE_COLOR }}>
          <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={() => onAddNew(dateStr)}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white"
            style={{ background: PRIMARY }}
          >
            Zaplanuj zlecenie
          </button>
        </div>
      </div>
    </div>
  );
}

function KpiDetailModal({ type, entries, freeDays, onEdit, onDelete, onSetStatus, onMarkDone, onMove, onEditFreeDay, onMoveFreeDay, onRemoveFreeDay, onSetPaymentStatus, onToggleInvoice, onClose }) {
  const cfg = DETAIL_CONFIG[type];
  const Icon = cfg.icon;
  const isFreeDays = type === "wolne";
  const freeDayGroups = isFreeDays ? groupConsecutiveFreeDays(freeDays) : [];
  const items = isFreeDays ? freeDayGroups : entries;
  const amountKey = (type === "wydatki" || type === "prywatne") ? "wydatki" : "zarobki";
  const total = isFreeDays ? null : items.reduce((s, e) => s + (Number(e[amountKey]) || 0), 0);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full sm:max-w-lg max-h-[85vh] flex flex-col rounded-t-2xl sm:rounded-2xl" style={{ background: SURFACE }}>
        <div className="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style={{ borderColor: LINE_COLOR }}>
          <h3 className="flex items-center gap-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", fontWeight: 600, color: cfg.color }}>
            <Icon size={17} /> {cfg.title}
          </h3>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>

        {total !== null && (
          <div className="px-5 py-3 border-b flex items-center justify-between flex-shrink-0" style={{ borderColor: LINE_COLOR, background: "#FAFBFA" }}>
            <span className="text-xs font-medium uppercase tracking-wide" style={{ color: "#5B6E67" }}>Razem ({items.length})</span>
            <span style={{ fontFamily: MONO_FONT, fontWeight: 700, fontSize: "1.05rem", color: cfg.color }}>{fmtPLN(total)}</span>
          </div>
        )}

        <div className="overflow-y-auto flex-1">
          {items.length === 0 ? (
            <div className="p-8 text-center text-sm" style={{ color: "#8CA098" }}>{cfg.empty}</div>
          ) : isFreeDays ? (
            <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
              {items.map((g) => {
                const isRange = g.startDate !== g.endDate;
                return (
                  <div key={g.ids[0]} className="px-5 py-3">
                    <div className="flex items-center gap-3 flex-wrap">
                      <div className="flex-shrink-0" style={{ minWidth: isRange ? 100 : 80 }}>
                        {isRange ? (
                          <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: "#8A6A1F", whiteSpace: "nowrap" }}>
                            {g.startDate.slice(8, 10)}.{g.startDate.slice(5, 7)}–{g.endDate.slice(8, 10)}.{g.endDate.slice(5, 7)}
                          </div>
                        ) : (
                          <>
                            <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: "#8A6A1F" }}>
                              {g.startDate.slice(8, 10)}.{g.startDate.slice(5, 7)}
                            </div>
                            <div className="text-[10px] capitalize" style={{ color: "#8CA098" }}>
                              {weekdayName(g.startDate)}
                            </div>
                          </>
                        )}
                      </div>
                      <div className="flex-1 min-w-[120px] text-sm font-medium truncate" style={{ color: INK }}>{g.opis || "—"}</div>
                      {isRange && (
                        <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full flex-shrink-0" style={{ background: "#FDF6E9", color: "#8A6A1F" }}>
                          {g.ids.length} dni
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-1 mt-2">
                      <button onClick={() => onMoveFreeDay(g)} className="p-1.5 rounded-md border hover:bg-sky-50 transition" style={{ borderColor: LINE_COLOR }} title="Przenieś termin">
                        <Move size={14} color="#2A5C8A" />
                      </button>
                      <button onClick={() => onEditFreeDay(g)} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Edytuj">
                        <Pencil size={14} color="#5B6E67" />
                      </button>
                      <button onClick={() => onRemoveFreeDay(g.ids)} className="p-1.5 rounded-md border hover:bg-red-50 transition" style={{ borderColor: LINE_COLOR }} title="Usuń dzień wolny">
                        <Trash2 size={14} color={CORAL} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="divide-y" style={{ borderColor: LINE_COLOR }}>
              {items.map((e) => {
                const isOverdue = (type === "zaplanowane" || type === "zalegle" || type === "prywatne") && e.statusZlecenia === "Zaplanowane" && e.data < todayStr();
                const isPrivate = e.typWpisu === "prywatne";
                const isZakup = !isPrivate && !e.klient && e.opisWydatkow;
                const isCancelled = e.statusZlecenia === "Odwołane";
                const isPlanned = e.statusZlecenia === "Zaplanowane";
                return (
                  <div key={e.id} className="px-5 py-3">
                    <div className="flex items-center gap-3 flex-wrap">
                      <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: isOverdue ? CORAL : cfg.color, minWidth: 56 }}>
                        {e.data.slice(8, 10)}.{e.data.slice(5, 7)}
                      </div>
                      <button onClick={() => { onEdit(e); onClose(); }} className="flex-1 min-w-[120px] text-left hover:opacity-70 transition">
                        <div className="flex items-center gap-1.5">
                          <div className="text-sm font-medium truncate" style={{ color: isPrivate ? PRIVATE_PURPLE : INK }}>{e.klient || e.opisWydatkow || "—"}</div>
                          {isOverdue && (
                            <span className="flex-shrink-0 inline-flex items-center gap-1 text-[10px] font-semibold px-1.5 py-0.5 rounded-full" style={{ background: "#FCE9E7", color: CORAL }}>
                              <AlertTriangle size={9} /> Zaległe
                            </span>
                          )}
                        </div>
                        {(e.adres || e.opisUslugi) && <div className="text-xs truncate" style={{ color: "#8CA098" }}>{e.adres || e.opisUslugi}</div>}
                      </button>
                      <div style={{ fontFamily: MONO_FONT, fontWeight: 600, color: isOverdue ? CORAL : cfg.color, flexShrink: 0, minWidth: 64, textAlign: "right" }}>
                        {fmtPLN(Number(e[amountKey]) || 0)}
                      </div>
                    </div>
                    <div className="flex items-center gap-1 mt-2">
                      {type === "oczekujacePlatnosci" && onSetPaymentStatus && (
                        <button onClick={() => onSetPaymentStatus(e.id, "Zapłacono")} className="p-1.5 rounded-md border hover:bg-emerald-50 transition" style={{ borderColor: LINE_COLOR }} title="Oznacz jako zapłacone">
                          <CheckCircle2 size={15} color={PRIMARY} />
                        </button>
                      )}
                      {type === "fakturyDoWystawienia" && onToggleInvoice && (
                        <button onClick={() => onToggleInvoice(e.id)} className="p-1.5 rounded-md border hover:bg-amber-50 transition" style={{ borderColor: LINE_COLOR }} title="Oznacz fakturę jako wystawioną">
                          <Receipt size={14} color="#8A6A1F" />
                        </button>
                      )}
                      {isPlanned && (
                        <button onClick={() => onMarkDone(e)} className="p-1.5 rounded-md border hover:bg-emerald-50 transition" style={{ borderColor: LINE_COLOR }} title="Oznacz jako wykonane">
                          <CheckCircle2 size={15} color={PRIMARY} />
                        </button>
                      )}
                      {!isZakup && !isCancelled && (
                        <button onClick={() => onSetStatus(e.id, "Odwołane")} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Odwołaj zlecenie">
                          <Ban size={15} color="#8CA098" />
                        </button>
                      )}
                      {!isCancelled && (
                        <button onClick={() => { onMove(e); onClose(); }} className="p-1.5 rounded-md border hover:bg-sky-50 transition" style={{ borderColor: LINE_COLOR }} title="Przenieś termin">
                          <Move size={14} color="#2A5C8A" />
                        </button>
                      )}
                      <button onClick={() => { onEdit(e); onClose(); }} className="p-1.5 rounded-md border hover:bg-gray-100 transition" style={{ borderColor: LINE_COLOR }} title="Edytuj">
                        <Pencil size={14} color="#5B6E67" />
                      </button>
                      <button onClick={() => onDelete(e.id)} className="p-1.5 rounded-md border hover:bg-red-50 transition" style={{ borderColor: LINE_COLOR }} title="Usuń">
                        <Trash2 size={14} color={CORAL} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function BackupsPanel({ backups, loading, error, hasFirebase, onExport, onImportFile, onRestore, onClose, onTestSave, testing, testResult }) {
  const [showDailyList, setShowDailyList] = useState(false);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(28,43,39,0.45)" }}>

          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={18} /></button>
        </div>

        <div className="p-5 space-y-4 overflow-y-auto flex-1">
          <div>
            <p className="text-sm mb-2" style={{ color: "#5B6E67" }}>

            </p>
            <button
              onClick={onExport}
              className="w-full px-4 py-2.5 rounded-lg text-sm font-semibold text-white"
              style={{ background: PRIMARY }}
            >
              Pobierz kopię teraz (plik)
            </button>
          </div>

          <div>
            <p className="text-sm mb-2" style={{ color: "#5B6E67" }}>
              Masz wcześniej pobrany plik kopii zapasowej? Wybierz go, żeby przywrócić z niego dane.
            </p>
            <label
              className="w-full flex items-center justify-center px-4 py-2.5 rounded-lg text-sm font-semibold border cursor-pointer"
              style={{ borderColor: PRIMARY, color: PRIMARY }}
            >

              <input
                type="file"
                accept="application/json,.json"
                className="hidden"
                onChange={(e) => {
                  const file = e.target.files && e.target.files[0];

                  e.target.value = "";
                }}
              />
            </label>
          </div>

          <div className="h-px" style={{ background: LINE_COLOR }} />

          {hasFirebase && (
            <div>
              <p className="text-sm mb-2" style={{ color: "#5B6E67" }}>
                Kopia w chmurze nie pojawia się? Sprawdź to na miejscu — poniższy przycisk od razu spróbuje zapisać i pokaże dokładny wynik.
              </p>
              <button
                onClick={onTestSave}
                disabled={testing}
                className="w-full px-4 py-2.5 rounded-lg text-sm font-semibold border disabled:opacity-50"
                style={{ borderColor: "#2A5C8A", color: "#2A5C8A" }}
              >
                {testing ? "Zapisywanie…" : "Sprawdź teraz — zapisz kopię"}
              </button>
              {testResult && testResult.ok && (
                <div className="text-xs p-3 rounded-lg mt-2" style={{ background: "#E4F3EC", color: PRIMARY_DARK }}>
                  ✓ Zapis się udał. Kopia z dzisiejszą datą powinna być widoczna na liście poniżej.
                </div>
              )}
              {testResult && !testResult.ok && (
                <div className="text-xs p-3 rounded-lg mt-2 space-y-1" style={{ background: "#FCE9E7", color: CORAL }}>
                  <div className="font-semibold">✕ Zapis się nie udał.</div>
                  <div style={{ fontFamily: MONO_FONT, opacity: 0.85 }}>{testResult.message}</div>
                </div>
              )}
            </div>
          )}

          <div className="h-px" style={{ background: LINE_COLOR }} />

          <div>
            <p className="text-sm mb-2" style={{ color: "#5B6E67" }}>
              Aplikacja sama zapisuje codzienną kopię danych w chmurze — w razie pomyłki możesz wrócić do dowolnego dnia z ostatnich 5.
            </p>
            {!hasFirebase && (
              <div className="text-xs p-3 rounded-lg" style={{ background: "#FDF6E9", color: "#8A6A1F" }}>
                Automatyczne kopie w chmurze są dostępne tylko, gdy aplikacja jest połączona z bazą danych.
              </div>
            )}
            {hasFirebase && error && (
              <div className="text-xs p-3 rounded-lg space-y-1" style={{ background: "#FCE9E7", color: CORAL }}>
                <div className="font-semibold">Nie udało się połączyć z kopiami w chmurze.</div>
                <div style={{ fontFamily: MONO_FONT, opacity: 0.85 }}>{error}</div>
                <div>Najczęstsza przyczyna: reguły bezpieczeństwa Firestore nie zostały opublikowane albo nie obejmują podkolekcji „backups".</div>
              </div>
            )}
            {hasFirebase && !error && loading && (
              <div className="text-sm text-center py-6" style={{ color: "#8CA098" }}>Wczytywanie…</div>
            )}
            {hasFirebase && !error && !loading && backups.length === 0 && (
              <div className="text-sm text-center py-6" style={{ color: "#8CA098" }}>Jeszcze brak zapisanych kopii — pojawią się automatycznie po dzisiejszych zmianach.</div>
            )}
            {hasFirebase && !error && !loading && backups.length > 0 && (
              <div>
                <button
                  onClick={() => setShowDailyList((v) => !v)}
                  className="w-full flex items-center justify-between px-4 py-2.5 rounded-lg text-sm font-semibold border transition hover:bg-gray-50"
                  style={{ borderColor: PRIMARY, color: PRIMARY }}
                >
                  <span>Kopie dzienne ({backups.length})</span>
                  <span style={{ transform: showDailyList ? "rotate(180deg)" : "none", transition: "transform 0.15s" }}>▾</span>
                </button>
                {showDailyList && (
                  <div className="space-y-2 mt-2">
                    {backups.map((b) => (
                      <div key={b.id} className="flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg" style={{ border: `1px solid ${LINE_COLOR}` }}>
                        <div>
                          <div style={{ fontFamily: MONO_FONT, fontSize: "0.85rem", fontWeight: 600, color: INK }}>
                            {b.id.split("-").reverse().join(".")}
                          </div>
                          <div className="text-xs" style={{ color: "#8CA098" }}>
                            {(b.items || []).length} wpisów · {(b.clients || []).length} klientów
                          </div>
                        </div>
                        <button
                          onClick={() => onRestore(b)}
                          className="text-xs font-semibold px-3 py-1.5 rounded-lg border transition hover:bg-gray-50"
                          style={{ borderColor: PRIMARY, color: PRIMARY }}
                        >
                          Przywróć
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

              </FormField>
            )}
            <FormField label={isPrivate ? "Czas trwania (h)" : "Czas pracy (h)"}>
              <input
                type="number" step="0.5"
                className={inputCls} style={{ borderColor: LINE_COLOR }}
                value={form.godziny}
                onChange={(e) => onChange("godziny", e.target.value)}
                placeholder="np. 2"
              />
            </FormField>
          </div>
        </div>
        <div className="flex gap-2 px-5 py-4 border-t" style={{ borderColor: LINE_COLOR }}>
          <button onClick={onCancel} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>
            Anuluj
          </button>
          <button
            onClick={onConfirm}
            className="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold text-white"
            style={{ background: isPrivate ? PRIVATE_PURPLE : PRIMARY }}
          >
            Oznacz jako wykonane
          </button>
        </div>
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, confirmLabel, onConfirm, onCancel }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(28,43,39,0.45)" }}>
      <div className="w-full max-w-sm rounded-2xl p-5" style={{ background: SURFACE }}>
        <h3 className="font-semibold mb-2" style={{ fontFamily: DISPLAY_FONT, fontSize: "1.1rem", color: PRIMARY_DARK }}>{title}</h3>
        <p className="text-sm mb-5" style={{ color: "#5B6E67" }}>{message}</p>
        <div className="flex gap-2">
          <button onClick={onCancel} className="flex-1 px-4 py-2 rounded-lg text-sm font-medium border" style={{ borderColor: LINE_COLOR, color: "#5B6E67" }}>Anuluj</button>
          <button onClick={onConfirm} className="flex-1 px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: CORAL }}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
