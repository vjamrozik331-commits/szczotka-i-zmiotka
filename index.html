// Polskie święta ustawowo wolne od pracy — stałe + ruchome (liczone od Wielkanocy).
function fmtDateISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDaysToDate(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}
function easterSunday(year) {
  // Algorytm Gaussa (anonimowy gregoriański) — data Wielkanocy dla danego roku.
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}
const _holidayCache = {};
function polishHolidaysForYear(year) {
  if (_holidayCache[year]) return _holidayCache[year];
  const easter = easterSunday(year);
  const map = {
    [`${year}-01-01`]: "Nowy Rok",
    [`${year}-01-06`]: "Święto Trzech Króli",
    [fmtDateISO(easter)]: "Wielkanoc",
    [fmtDateISO(addDaysToDate(easter, 1))]: "Poniedziałek Wielkanocny",
    [`${year}-05-01`]: "Święto Pracy",
    [`${year}-05-03`]: "Święto Konstytucji 3 Maja",
    [fmtDateISO(addDaysToDate(easter, 49))]: "Zielone Świątki",
    [fmtDateISO(addDaysToDate(easter, 60))]: "Boże Ciało",
    [`${year}-08-15`]: "Wniebowzięcie NMP",
    [`${year}-11-01`]: "Wszystkich Świętych",
    [`${year}-11-11`]: "Święto Niepodległości",
    [`${year}-12-25`]: "Boże Narodzenie",
    [`${year}-12-26`]: "Drugi dzień Świąt",
  };
  _holidayCache[year] = map;
  return map;
}
function polishHolidayName(dateStr) {

function defaultOrderStatus(dateStr) {

// Wspólna logika liczenia faktur VAT do wystawienia — używana zarówno przez zakładkę
// "Faktury", jak i sekcję w "Podsumowanie", żeby liczby zawsze były ze sobą spójne.
// Wspólna logika grupowania kolejnych dni wolnych o tym samym opisie w jeden zakres
// "od-do" — używana zarówno przez listę dni wolnych, jak i przez pigułki w widoku
// miesiąca oraz popup kafelka "Dni wolne", żeby zawsze wyglądały tak samo.
function groupConsecutiveFreeDays(freeDays, year) {
  const sorted = (freeDays || [])
    .filter((d) => d.date && (!year || d.date.startsWith(String(year))))
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date));
  const result = [];
  let current = null;
  sorted.forEach((fd) => {
    const opis = fd.opis || "";
    if (current) {
      const prevDate = new Date(current.endDate + "T00:00:00");
      const thisDate = new Date(fd.date + "T00:00:00");
      const diffDays = Math.round((thisDate - prevDate) / (1000 * 60 * 60 * 24));
      if (diffDays === 1 && opis === current.opis) {
        current.endDate = fd.date;
        current.ids.push(fd.id);
        return;
      }
    }
    current = { ids: [fd.id], startDate: fd.date, endDate: fd.date, opis };
    result.push(current);
  });
  return result;
}

function computeInvoicesByYear(entries, year) {
  const filtered = (entries || []).filter(
    (e) => e.fakturaVat && e.klient && e.klient.trim() && e.data && e.data.startsWith(String(year)) && e.statusZlecenia !== "Odwołane"
  );
  const groups = {};
  filtered.forEach((e) => {
    const monthIdx = new Date(e.data + "T00:00:00").getMonth();
    if (!groups[monthIdx]) groups[monthIdx] = {};
    if (!groups[monthIdx][e.klient]) groups[monthIdx][e.klient] = { total: 0, count: 0, issuedCount: 0, entries: [] };
    groups[monthIdx][e.klient].total += Number(e.zarobki) || 0;
    groups[monthIdx][e.klient].count += 1;
    if (e.fakturaWystawiona) groups[monthIdx][e.klient].issuedCount += 1;
    groups[monthIdx][e.klient].entries.push(e);
  });
  const months = Object.keys(groups)
    .map(Number)
    .sort((a, b) => a - b)
    .map((monthIdx) => ({
      monthIdx,
      monthName: MONTH_NAMES[monthIdx],
      clients: Object.entries(groups[monthIdx])
        .map(([klient, data]) => ({ klient, ...data }))
        .sort((a, b) => b.total - a.total),
    }));
  const issued = filtered.filter((e) => e.fakturaWystawiona);
  const pending = filtered.filter((e) => !e.fakturaWystawiona);
  return {
    months,
    totalCount: filtered.length,
    totalValue: filtered.reduce((s, e) => s + (Number(e.zarobki) || 0), 0),
    issuedCount: issued.length,
    issuedValue: issued.reduce((s, e) => s + (Number(e.zarobki) || 0), 0),
    pendingCount: pending.length,
    pendingValue: pending.reduce((s, e) => s + (Number(e.zarobki) || 0), 0),
  };
}

function isRealized(e) {
  return e.statusZlecenia !== "Zaplanowane" && e.statusZlecenia !== "Odwołane";
}
function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + (m || 0);
}
function fmtTimeRange(start, hours) {
  const startMin = timeToMinutes(start);
  const dur = (Number(hours) || 1) * 60;
  const endMin = startMin + dur;
  const fmt = (min) => `${String(Math.floor((min % 1440) / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
  return `${fmt(startMin)}–${fmt(endMin)}`;
}
function findConflict(entries, payload, excludeId) {
  if (!payload.godzinaStart || !payload.data) return null;
  const startA = timeToMinutes(payload.godzinaStart);
  const endA = startA + (Number(payload.godziny) || 1) * 60;
  for (const e of entries) {
    if (e.id === excludeId) continue;
    if (e.data !== payload.data) continue;
    if (!e.godzinaStart) continue;
    if (e.statusZlecenia === "Odwołane") continue;
    const startB = timeToMinutes(e.godzinaStart);
    const endB = startB + (Number(e.godziny) || 1) * 60;
    if (startA < endB && startB < endA) return e;
  }
  return null;
}

// Sorts by date, then by time of day (entries without a time come after those with one,
// on the same date), then by id as a final stable tiebreaker.
function compareEntries(a, b) {
  if (a.data !== b.data) return a.data < b.data ? -1 : 1;
  const at = a.godzinaStart, bt = b.godzinaStart;
  if (at && bt && at !== bt) return at < bt ? -1 : 1;
  if (at && !bt) return -1;
  if (!at && bt) return 1;
  return a.id - b.id;
}

// One-time migration helper: builds an explicit client list from historical entries
// (used the first time the app runs, before a real "clients" list exists yet).
function computeBusyDates(entriesArr, freeDaysArr) {
  const set = new Set();
  (entriesArr || []).forEach((e) => {
    if (!e.data || e.statusZlecenia === "Odwołane") return;
    const isAppointment = (e.klient && e.klient.trim()) || e.typWpisu === "prywatne";
    if (isAppointment) set.add(e.data);
  });
  (freeDaysArr || []).forEach((d) => { if (d.date) set.add(d.date); });
  return Array.from(set);
}

// Publiczna dostępność godzinowa (dla formularza rezerwacji na stronie WWW):
// - offDates: dni całkowicie niedostępne (dni wolne Vanessy) — cały dzień zablokowany
// - slotsByDate: zajęte przedziały godzinowe każdego dnia, wyliczone tak samo jak
//   wykrywanie konfliktów w apce (godzinaStart + godziny, domyślnie 1h jeśli nie podano)
function computePublicAvailability(entriesArr, freeDaysArr) {
  const offDates = new Set();
  (freeDaysArr || []).forEach((d) => { if (d.date) offDates.add(d.date); });
  const holidayDates = new Set();
  const thisYear = new Date().getFullYear();
  [thisYear, thisYear + 1].forEach((y) => {
    Object.keys(polishHolidaysForYear(y)).forEach((d) => { holidayDates.add(d); offDates.add(d); });
  });
  const slotsByDate = {};
  (entriesArr || []).forEach((e) => {
    if (!e.data || e.statusZlecenia === "Odwołane") return;
    const isAppointment = (e.klient && e.klient.trim()) || e.typWpisu === "prywatne";
    if (!isAppointment || !e.godzinaStart) return;
    const startMin = timeToMinutes(e.godzinaStart);
    const durMin = (Number(e.godziny) || 2) * 60; // domyślnie 2h, gdy czas trwania nie jest wpisany (tylko dla publicznej dostępności na stronie)
    const endMin = startMin + durMin;
    const fmt = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
    if (!slotsByDate[e.data]) slotsByDate[e.data] = [];
    slotsByDate[e.data].push({ start: fmt(startMin), end: fmt(endMin) });
  });
  return { offDates: Array.from(offDates), holidayDates: Array.from(holidayDates), slotsByDate };
}

function deriveClientsFromEntries(entries) {
  const map = {};
  const order = [];
  (entries || [])
    .filter((e) => e.klient && e.klient.trim())
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""))
    .forEach((e) => {
      if (!map[e.klient]) order.push(e.klient);
      map[e.klient] = { name: e.klient, adres: e.adres || "", typKlienta: e.typKlienta || "", telefon: "", uwagi: "" };
    });
  return order.map((name, i) => ({ id: Date.now() + i, ...map[name] }));
}

function App() {
  const [entries, setEntries] = useState(null);
  const [freeDays, setFreeDays] = useState([]);
  const [clients, setClients] = useState([]);
  const [year, setYear] = useState(DEFAULT_YEAR);
  const [activeTab, setActiveTab] = useState(new Date().getMonth() < 12 ? new Date().getMonth() : 0);
  const [view, setView] = useState("month"); // "month" | "summary" | "upcoming"
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [formType, setFormType] = useState("klient"); // "klient" | "zakup" | "full"
  const [form, setForm] = useState(emptyForm);
  const [search, setSearch] = useState("");
  const [searchScope, setSearchScope] = useState("month"); // "month" | "year"
  const [conflictInfo, setConflictInfo] = useState(null);
  const [moveInfo, setMoveInfo] = useState(null);
  const [moveConflict, setMoveConflict] = useState(null);
  const [showFreeDaysList, setShowFreeDaysList] = useState(false);
  const [editingFreeDayGroup, setEditingFreeDayGroup] = useState(null); // { ids, startDate, endDate, opis } lub null
  const [movingFreeDayGroup, setMovingFreeDayGroup] = useState(null); // { ids, startDate, endDate, opis } lub null
  const [movingFreeDayDate, setMovingFreeDayDate] = useState("");
  const [showFreeDayForm, setShowFreeDayForm] = useState(false);
  const [freeDayForm, setFreeDayForm] = useState({ start: "", end: "", opis: "" });
  const [freeDayConflict, setFreeDayConflict] = useState(null);
  const [showClientForm, setShowClientForm] = useState(false);
  const [editingClientId, setEditingClientId] = useState(null);
  const [clientForm, setClientForm] = useState({ name: "", adres: "", telefon: "", typKlienta: "", uwagi: "", fakturaVat: false });
  const [clientSearch, setClientSearch] = useState("");
  const [showBackupsPanel, setShowBackupsPanel] = useState(false);
  const [confirmDoneEntry, setConfirmDoneEntry] = useState(null);
  const [doneForm, setDoneForm] = useState({ zarobki: "", godziny: "", wydatki: "" });
  const [backupsList, setBackupsList] = useState([]);
  const [backupsLoading, setBackupsLoading] = useState(false);
  const [backupsError, setBackupsError] = useState(null);
  const [backupsTesting, setBackupsTesting] = useState(false);
  const [backupsTestResult, setBackupsTestResult] = useState(null); // { ok: true } | { ok: false, message } | null
  const [confirmRestoreBackup, setConfirmRestoreBackup] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [undoHistory, setUndoHistory] = useState([]);
  const [wwwQueue, setWwwQueue] = useState([]); // kolejka nowych zleceń zaimportowanych ze strony WWW, czekających na popup

  // load from Firestore (real-time sync across devices) with localStorage fallback
  useEffect(() => {
    if (!window.firebaseDb) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const loadedEntries = raw ? JSON.parse(raw) : SEED_ENTRIES;
        setEntries(loadedEntries);
        const rawFree = localStorage.getItem(STORAGE_KEY_FREE);
        setFreeDays(rawFree ? JSON.parse(rawFree) : []);
        const rawClients = localStorage.getItem(STORAGE_KEY_CLIENTS);
        setClients(rawClients ? JSON.parse(rawClients) : deriveClientsFromEntries(loadedEntries));
      } catch (e) {
        setEntries(SEED_ENTRIES);
        setClients(deriveClientsFromEntries(SEED_ENTRIES));
      }
      return;
    }
    const docRef = window.firebaseDb.collection("app-data").doc("entries");
    const unsub = docRef.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const data = snap.data();
          setEntries(data.items || []);
          setFreeDays(data.freeDays || []);
          if (data.clients && data.clients.length > 0) {
            setClients(data.clients);
          } else {
            const derived = deriveClientsFromEntries(data.items || []);
            setClients(derived);
            if (derived.length > 0) docRef.set({ clients: derived }, { merge: true }).catch(() => {});
          }
          setSaveState("saved");
        } else if (snap.metadata.fromCache) {
          // The device hasn't confirmed with the server yet — a cache-only "not found" is
          // NOT reliable proof the document is missing. Treating it as missing here would
          // (and previously did) overwrite real data with the starter sample the moment a
          // fresh browser/tab opens before it's had a chance to sync. Just wait quietly for
          // the next, server-confirmed snapshot instead of touching anything.
        } else {
          // Confirmed by the server itself: the document genuinely does not exist yet
          // (e.g. very first run ever). Safe to seed.
          const seededClients = deriveClientsFromEntries(SEED_ENTRIES);
          docRef.set({ items: SEED_ENTRIES, freeDays: [], clients: seededClients }).catch(() => {});
          setEntries(SEED_ENTRIES);
          setFreeDays([]);
          setClients(seededClients);
          setSaveState("saved");
        }
      },
      () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const loadedEntries = raw ? JSON.parse(raw) : SEED_ENTRIES;
          setEntries(loadedEntries);
          const rawFree = localStorage.getItem(STORAGE_KEY_FREE);
          setFreeDays(rawFree ? JSON.parse(rawFree) : []);
          const rawClients = localStorage.getItem(STORAGE_KEY_CLIENTS);
          setClients(rawClients ? JSON.parse(rawClients) : deriveClientsFromEntries(loadedEntries));
        } catch (e) {
          setEntries(SEED_ENTRIES);
        }
      }
    );
    return () => unsub();
  }, []);

  // Refy trzymające najnowszy stan — używane przez nasłuch rezerwacji poniżej, żeby
  // uniknąć "starych" domknięć (closures) bez konieczności ciągłego przełączania się na nowo
  // na kolekcję Firestore przy każdej zmianie danych.
  const entriesRef = useRef(entries);
  useEffect(() => { entriesRef.current = entries; }, [entries]);
  const freeDaysRef = useRef(freeDays);
  useEffect(() => { freeDaysRef.current = freeDays; }, [freeDays]);
  const clientsRef = useRef(clients);
  useEffect(() => { clientsRef.current = clients; }, [clients]);

  // Automatyczny import zapisów klientów ze strony WWW: formularz na stronie zapisuje
  // każdą rezerwację jako osobny dokument w kolekcji "rezerwacje" (status "nowe"), żeby
  // nigdy nie dotykać bezpośrednio głównego dokumentu z danymi (to jedyne miejsce, które
  // je zapisuje, tak jak dotychczas — brak ryzyka nadpisania danych przez wielu piszących
  // naraz). Ta aplikacja, gdy jest otwarta, wyłapuje nowe rezerwacje i sama dopisuje je
  // do terminarza jako zaplanowane zlecenie.
  useEffect(() => {
    if (!window.firebaseDb) return;
    const q = window.firebaseDb.collection("rezerwacje").where("status", "==", "nowe");
    const unsub = q.onSnapshot((snap) => {
      snap.docChanges().forEach((change) => {
        if (change.type !== "added") return;
        const doc = change.doc;
        const data = doc.data() || {};
        if (!data.data) { doc.ref.update({ status: "odrzucone", powod: "brak daty" }).catch(() => {}); return; }
        const currentEntries = entriesRef.current;
        const nextId = currentEntries.length ? Math.max(...currentEntries.map((e) => e.id)) + 1 : 1;
        const newEntry = {
          id: nextId,
          data: data.data,
          godzinaStart: data.godzinaStart || "",
          klient: (data.klient || "").trim(),
          adres: (data.adres || "").trim(),
          opisUslugi: (data.opisUslugi || "usługi sprzątające").trim(),
          godziny: data.godziny ? Number(data.godziny) : null, zarobki: null, wydatki: null, opisWydatkow: "", kategoria: "",
          typKlienta: "Osoba prywatna", status: "",
          uwagi: ["Zapisano przez stronę WWW", (data.telefon || "").trim() ? `tel. ${data.telefon.trim()}` : "", (data.uwagi || "").trim()]
            .filter(Boolean).join(" · "),
          statusZlecenia: "Zaplanowane", fakturaVat: false, typWpisu: "", zrodloRezerwacji: "www",
        };
        const nextEntries = [...currentEntries, newEntry];
        const nextClients = newEntry.klient
          ? computeClientsAfterEntry(clientsRef.current, newEntry.klient, newEntry.adres, newEntry.typKlienta)
          : clientsRef.current;
        entriesRef.current = nextEntries;
        clientsRef.current = nextClients;
        setEntries(nextEntries);
        setClients(nextClients);
        persistState(nextEntries, freeDaysRef.current, nextClients);
        doc.ref.update({ status: "zaimportowane", zaimportowanoAt: Date.now() }).catch(() => {});
        setWwwQueue((q) => [...q, newEntry]);
      });
    }, () => {});
    return () => unsub();
  }, []);

  // Explicit sync — called only from user-initiated mutations below, never from the
  // Firestore listener itself. This is what prevents a device that just loaded a
  // (possibly momentarily stale) snapshot from echoing it back and clobbering a
  // newer write made from another device in the meantime.
  function writeBackupSnapshot(nextEntries, nextFreeDays, nextClients) {
    if (!window.firebaseDb) return Promise.reject(new Error("Brak połączenia z bazą danych (window.firebaseDb nie istnieje)"));
    const docRef = window.firebaseDb.collection("app-data").doc("entries");
    const todayKey = todayStr();
    return docRef.collection("backups").doc(todayKey).set({
      items: nextEntries, freeDays: nextFreeDays, clients: nextClients,
      savedAt: Date.now(),
    });
  }

  function persistState(nextEntries, nextFreeDays, nextClients) {
    const clientsToSave = nextClients !== undefined ? nextClients : clients;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nextEntries));
      localStorage.setItem(STORAGE_KEY_FREE, JSON.stringify(nextFreeDays));
      localStorage.setItem(STORAGE_KEY_CLIENTS, JSON.stringify(clientsToSave));
    } catch (e) {}
    if (window.firebaseDb) {
      setSaveState("saving");
      const docRef = window.firebaseDb.collection("app-data").doc("entries");
      docRef.set({ items: nextEntries, freeDays: nextFreeDays, clients: clientsToSave })
        .then(() => setSaveState("saved"))
        .catch(() => setSaveState("error"));
      // Publiczny, "chudy" dokument bez danych klientów/finansów — czyta go strona WWW,
      // żeby pokazać zajęte dni w formularzu zapisu, bez ujawniania reszty bazy.
      window.firebaseDb.collection("app-data").doc("public-availability")
        .set({ ...computePublicAvailability(nextEntries, nextFreeDays), updatedAt: Date.now() })
        .catch(() => {});
      // Automatyczna, codzienna kopia zapasowa — działa w tle, bez żadnej akcji użytkownika.
      // Nadpisuje się przez cały dzień (zawsze trzyma najnowszy stan z danego dnia), a od
      // północy zaczyna nowy, osobny dokument — więc z czasem powstaje historia dzień po dniu,
      // z której można w razie czego przywrócić dane sprzed awarii czy pomyłki.
      writeBackupSnapshot(nextEntries, nextFreeDays, clientsToSave)
        .then(() => setBackupsError(null))
        .catch((err) => setBackupsError(err && err.message ? err.message : String(err)));
    }
  }

  function testBackupWrite() {
    setBackupsTesting(true);
    setBackupsTestResult(null);
    writeBackupSnapshot(entries, freeDays, clients)
      .then(() => {
        setBackupsTesting(false);
        setBackupsTestResult({ ok: true });
        loadBackupsList();
      })
      .catch((err) => {
        setBackupsTesting(false);
        const message = err && err.message ? err.message : String(err);
        setBackupsTestResult({ ok: false, message });
        setBackupsError(message);
      });
  }

  // Cofnij — jedno naciśnięcie cofa jedną zmianę. Przed każdą modyfikacją odkładamy na stos
  // stan sprzed tej zmiany (maks. 20 kroków wstecz), żeby "Cofnij" mogło do niego wrócić.
  const MAX_UNDO_HISTORY = 20;

  function syncToFirestore(nextEntries, nextFreeDays, nextClients) {
    setUndoHistory((h) => {
      const next = [...h, { entries, freeDays, clients }];
      return next.length > MAX_UNDO_HISTORY ? next.slice(next.length - MAX_UNDO_HISTORY) : next;
    });
    persistState(nextEntries, nextFreeDays, nextClients);
  }

  function undoLastChange() {
    if (undoHistory.length === 0) return;
    const prev = undoHistory[undoHistory.length - 1];
    setUndoHistory((h) => h.slice(0, -1));
    setEntries(prev.entries);
    setFreeDays(prev.freeDays);
    setClients(prev.clients);
    persistState(prev.entries, prev.freeDays, prev.clients);
  }

  function exportBackupFile() {
    const payload = {
      exportedAt: new Date().toISOString(),
      items: entries, freeDays, clients,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `szczotka-i-zmiotka-kopia-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function loadBackupsList() {
    if (!window.firebaseDb) return;
    setBackupsLoading(true);
    window.firebaseDb.collection("app-data").doc("entries").collection("backups")
      .get()
      .then((snap) => {
        const list = [];
        snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0) || b.id.localeCompare(a.id));
        setBackupsList(list.slice(0, 5));
        setBackupsLoading(false);
        // Czytanie się udało — jeśli faktycznie są jakieś kopie, to dowód że wszystko działa,
        // więc czyścimy ewentualny stary błąd zapisu. Jeśli lista jest pusta, zostawiamy
        // błąd zapisu widoczny (jeśli jakiś wystąpił) zamiast go przedwcześnie kasować —
        // udane odczytanie pustej kolekcji nie dowodzi, że zapisy też działają.
        if (list.length > 0) setBackupsError(null);
      })
      .catch((err) => {
        setBackupsError(err && err.message ? err.message : String(err));
        setBackupsLoading(false);
      });
  }

  function restoreBackup(backup) {
    const nextEntries = backup.items || [];
    const nextFree = backup.freeDays || [];
    const nextClients = backup.clients || [];
    setEntries(nextEntries);
    setFreeDays(nextFree);
    setClients(nextClients);
    syncToFirestore(nextEntries, nextFree, nextClients);
    setConfirmRestoreBackup(null);
    setShowBackupsPanel(false);
  }

  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed.items)) throw new Error("Nieprawidłowy format pliku");
        setConfirmRestoreBackup({
          fromFile: true,
          fileName: file.name,
          exportedAt: parsed.exportedAt,
          items: parsed.items || [],
          freeDays: parsed.freeDays || [],
          clients: parsed.clients || [],
        });
      } catch (err) {
        alert("Nie udało się odczytać tego pliku — upewnij się, że to plik kopii zapasowej wygenerowany przez tę aplikację.");
      }
    };
    reader.readAsText(file);
  }

  function importBackupFile(file) {
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed.items)) throw new Error("bad format");
        const label = parsed.exportedAt ? parsed.exportedAt.slice(0, 10) : "plik";
        setConfirmRestoreBackup({
          id: `plik z ${label}`,
          items: parsed.items,
          freeDays: Array.isArray(parsed.freeDays) ? parsed.freeDays : [],
          clients: Array.isArray(parsed.clients) ? parsed.clients : [],
          isFile: true,
        });
      } catch (err) {
        setImportError("Nie udało się odczytać tego pliku — sprawdź, czy to poprawna kopia zapasowa z tej aplikacji.");
      }
    };
    reader.readAsText(file);
  }


  const isYearSearch = search.trim() !== "" && searchScope === "year";

  const monthEntries = useMemo(() => {
    if (!entries) return [];
    const base = isYearSearch
      ? entries.filter((e) => e.data && new Date(e.data + "T00:00:00").getFullYear() === year)
      : entries.filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === activeTab && new Date(e.data + "T00:00:00").getFullYear() === year);
    return base
      .sort(compareEntries)
      .filter((e) => {
        if (!search.trim()) return true;
        const s = search.toLowerCase();
        return (e.klient || "").toLowerCase().includes(s) || (e.adres || "").toLowerCase().includes(s);
      });
  }, [entries, activeTab, year, search, isYearSearch]);

  const monthSummary = useMemo(() => {
    const all = (entries || []).filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === activeTab && new Date(e.data + "T00:00:00").getFullYear() === year);
    const done = all.filter(isRealized);
    const godziny = done.reduce((s, e) => s + (Number(e.godziny) || 0), 0);
    const zarobki = done.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    const wydatki = done.reduce((s, e) => s + (Number(e.wydatki) || 0), 0);
    const liczbaZlecen = done.filter((e) => e.klient && e.klient.trim()).length;
    const planned = all.filter((e) => e.statusZlecenia === "Zaplanowane");
    const zaplanowaneZarobki = planned.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    const today = todayStr();
    const overduePlanned = planned.filter((e) => e.data < today);
    const zaległeZarobki = overduePlanned.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    return {
      godziny, zarobki, wydatki, zysk: zarobki - wydatki, liczbaZlecen,
      stawka: godziny > 0 ? zarobki / godziny : 0,
      zaplanowaneLiczba: planned.length, zaplanowaneZarobki,
      zaległeLiczba: overduePlanned.length, zaległeZarobki,
    };
  }, [entries, activeTab, year]);

  const monthDetailLists = useMemo(() => {
    const all = (entries || []).filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === activeTab && new Date(e.data + "T00:00:00").getFullYear() === year);
    const zarobki = all.filter((e) => isRealized(e) && Number(e.zarobki) > 0).sort(compareEntries);
    const wydatki = all.filter((e) => Number(e.wydatki) > 0).sort(compareEntries);
    const zaplanowane = all.filter((e) => e.statusZlecenia === "Zaplanowane").sort(compareEntries);
    const today = todayStr();
    const zalegle = all.filter((e) => e.statusZlecenia === "Zaplanowane" && e.data < today).sort(compareEntries);
    const prywatne = all.filter((e) => e.typWpisu === "prywatne" && e.statusZlecenia !== "Odwołane").sort(compareEntries);
    const zeStrony = all.filter((e) => e.zrodloRezerwacji === "www" && e.statusZlecenia !== "Odwołane").sort(compareEntries);
    const oczekujacePlatnosci = all.filter((e) => e.statusZlecenia === "Wykonane" && e.status === "Oczekuje" && Number(e.zarobki) > 0 && !e.fakturaVat).sort(compareEntries);
    const fakturyDoWystawienia = all.filter((e) => e.fakturaVat && !e.fakturaWystawiona && e.statusZlecenia !== "Odwołane").sort(compareEntries);
    return { zarobki, wydatki, zaplanowane, zalegle, prywatne, zeStrony, oczekujacePlatnosci, fakturyDoWystawienia };
  }, [entries, activeTab, year]);

  const knownClients = useMemo(() => {
    const alphabetical = clients.slice().sort((a, b) => a.name.localeCompare(b.name, "pl"));
    const byName = {};
    clients.forEach((c) => { byName[c.name] = c; });
    const seen = new Set();
    const order = [];
    (entries || [])
      .filter((e) => e.klient && e.klient.trim())
      .sort((a, b) => (a.data || "").localeCompare(b.data || ""))
      .forEach((e) => {
        if (!seen.has(e.klient)) { seen.add(e.klient); order.push(e.klient); }
      });
    const recent = order.slice().reverse().map((name) => byName[name] || { name, adres: "", typKlienta: "" }).slice(0, 8);
    return { list: alphabetical, recent };
  }, [clients, entries]);

  function computeClientsAfterEntry(prevClients, name, adres, typKlienta) {
    if (!name || !name.trim()) return prevClients;
    const exists = prevClients.find((c) => c.name === name);
    if (exists) {
      return prevClients.map((c) => (c.name === name ? { ...c, adres: adres || c.adres, typKlienta: typKlienta || c.typKlienta } : c));
    }
    return [...prevClients, { id: Date.now() + Math.random(), name: name.trim(), adres: adres || "", typKlienta: typKlienta || "", telefon: "", uwagi: "" }];
  }

  const yearData = useMemo(() => {
    const months = MONTH_NAMES.map((name, idx) => {
      const all = (entries || []).filter((e) => e.data && new Date(e.data + "T00:00:00").getMonth() === idx && new Date(e.data + "T00:00:00").getFullYear() === year).filter(isRealized);
      const godziny = all.reduce((s, e) => s + (Number(e.godziny) || 0), 0);
      const zarobki = all.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
      const wydatki = all.reduce((s, e) => s + (Number(e.wydatki) || 0), 0);
      const liczbaZlecen = all.filter((e) => e.klient && e.klient.trim()).length;
      const zysk = zarobki - wydatki;
      const dniWolne = (freeDays || []).filter((d) => d.date && new Date(d.date + "T00:00:00").getMonth() === idx && new Date(d.date + "T00:00:00").getFullYear() === year).length;
      return { name, godziny, zarobki, wydatki, zysk, liczbaZlecen, dniWolne, stawka: godziny > 0 ? zarobki / godziny : 0, marza: zarobki > 0 ? zysk / zarobki : 0 };
    });
    let cum = 0;
    const withCum = months.map((m) => { cum += m.zysk; return { ...m, skumulowany: cum }; });

    const totalZarobki = months.reduce((s, m) => s + m.zarobki, 0);
    const totalWydatki = months.reduce((s, m) => s + m.wydatki, 0);
    const totalGodziny = months.reduce((s, m) => s + m.godziny, 0);
    const totalZlecenia = months.reduce((s, m) => s + m.liczbaZlecen, 0);
    const totalDniWolne = months.reduce((s, m) => s + m.dniWolne, 0);

    const inYear = (e) => e.data && new Date(e.data + "T00:00:00").getFullYear() === year;

    const catMap = {};
    (entries || []).filter(isRealized).filter(inYear).forEach((e) => {
      if (Number(e.wydatki) > 0) {
        const cat = e.kategoria || "Inne";
        catMap[cat] = (catMap[cat] || 0) + Number(e.wydatki);
      }
    });
    const categories = CATEGORIES.map((c) => ({ name: c, value: Math.round((catMap[c] || 0) * 100) / 100 })).filter((c) => c.value > 0);

    const clientMap = {};
    (entries || []).filter(isRealized).filter(inYear).forEach((e) => {
      if (e.klient && e.klient.trim()) {
        if (!clientMap[e.klient]) clientMap[e.klient] = { klient: e.klient, zarobki: 0, liczba: 0 };
        clientMap[e.klient].zarobki += Number(e.zarobki) || 0;
        clientMap[e.klient].liczba += 1;
      }
    });
    const topClients = Object.values(clientMap).sort((a, b) => b.zarobki - a.zarobki).slice(0, 10);

    const plannedAll = (entries || []).filter((e) => e.statusZlecenia === "Zaplanowane").filter(inYear);
    const zaplanowaneZarobki = plannedAll.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);

    return {
      months: withCum, totalZarobki, totalWydatki, totalGodziny, totalZlecenia, totalDniWolne,
      totalZysk: totalZarobki - totalWydatki,
      marza: totalZarobki > 0 ? (totalZarobki - totalWydatki) / totalZarobki : 0,
      stawka: totalGodziny > 0 ? totalZarobki / totalGodziny : 0,
      categories, topClients,
      zaplanowaneLiczba: plannedAll.length, zaplanowaneZarobki,
    };
  }, [entries, year, freeDays]);

  const upcomingData = useMemo(() => {
    const all = entries || [];
    const today = todayStr();
    const planned = all.filter((e) => e.statusZlecenia === "Zaplanowane" && e.data);
    const overdue = planned.filter((e) => e.data < today).sort(compareEntries);
    const upcoming = planned.filter((e) => e.data >= today).sort(compareEntries);
    const zarobkiPlanowane = planned.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    const next7 = upcoming.filter((e) => {
      const d = new Date(e.data + "T00:00:00");
      const t = new Date(today + "T00:00:00");
      const diff = (d - t) / (1000 * 60 * 60 * 24);
      return diff <= 7;
    });
    return { overdue, upcoming, zarobkiPlanowane, liczba: planned.length, next7count: next7.length };
  }, [entries]);

  const completedData = useMemo(() => {
    const all = (entries || []).filter((e) => e.klient && e.klient.trim() && isRealized(e) && e.data && e.data.startsWith(String(year)));
    const done = all.slice().sort(compareEntries);
    const zarobki = done.reduce((s, e) => s + (Number(e.zarobki) || 0), 0);
    return { done, zarobki, liczba: done.length };
  }, [entries, year]);

  const invoicesData = useMemo(() => computeInvoicesByYear(entries, year), [entries, year]);

  const calendarCells = useMemo(() => {
    const first = new Date(year, activeTab, 1);
    const daysInMonth = new Date(year, activeTab + 1, 0).getDate();
    const startOffset = (first.getDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(activeTab + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayEntries = monthEntriesForCalendar(entries, dateStr);
      const freeDay = freeDays.find((f) => f.date === dateStr) || null;
      cells.push({ day: d, dateStr, entries: dayEntries, freeDay });
    }
    return cells;
  }, [entries, activeTab, year, freeDays]);

  function monthEntriesForCalendar(entries, dateStr) {
    return (entries || []).filter((e) => e.data === dateStr);
  }

  const openAddClientForm = useCallback((dateStr) => {

    setFormType("klient");
    const d = dateStr || `${year}-${String(activeTab + 1).padStart(2, "0")}-01`;
    setForm({ ...emptyForm, data: d, statusZlecenia: defaultOrderStatus(d) });

  const openAddPrivateForm = useCallback((dateStr) => {
    setEditingId(null);
    setFormType("prywatne");
    const d = dateStr || `${year}-${String(activeTab + 1).padStart(2, "0")}-01`;

  const openAddOrderForClient = useCallback((client) => {

    setForm({
      ...emptyForm, data: d, statusZlecenia: defaultOrderStatus(d),

  const openEditForm = useCallback((entry) => {
    setEditingId(entry.id);
    const hasKlient = !!(entry.klient && entry.klient.trim());
    const hasZakup = (entry.wydatki !== null && entry.wydatki !== undefined && entry.wydatki !== "") || !!(entry.opisWydatkow && entry.opisWydatkow.trim());
    let detectedType = "full";
    if (entry.typWpisu === "prywatne") detectedType = "prywatne";
    else if (hasKlient && !hasZakup) detectedType = "klient";
    else if (hasZakup && !hasKlient) detectedType = "zakup";
    else if (!hasKlient && !hasZakup) detectedType = "klient";
    setFormType(detectedType);
    setForm({
      data: entry.data || "", godzinaStart: entry.godzinaStart || "", klient: entry.klient || "", adres: entry.adres || "",
      opisUslugi: entry.opisUslugi || "", godziny: entry.godziny ?? "", zarobki: entry.zarobki ?? "",
      wydatki: entry.wydatki ?? "", opisWydatkow: entry.opisWydatkow || "", kategoria: entry.kategoria || "",
      typKlienta: entry.typKlienta || "", status: entry.status || "", uwagi: entry.uwagi || "",
      statusZlecenia: entry.statusZlecenia || defaultOrderStatus(entry.data),
      fakturaVat: !!entry.fakturaVat, typWpisu: entry.typWpisu || "",
    });
    setShowForm(true);
  }, []);

  function handleFormChange(field, value) {
    setForm((f) => {
      const next = { ...f, [field]: value };
      if (field === "opisWydatkow" && !f.kategoria) {
        next.kategoria = categorize(value);
      }
      if (field === "klient") {
        const known = knownClients.list.find((c) => c.name === value);
        if (known) {
          if (!f.adres) next.adres = known.adres;
          if (known.typKlienta) next.typKlienta = known.typKlienta;
          next.fakturaVat = !!known.fakturaVat;
        } else if (!f.typKlienta) {
          next.typKlienta = classifyClient(value);
        }
      }
      return next;
    });
  }

  function buildPayload() {
    const payload = {
      data: form.data, godzinaStart: form.godzinaStart, klient: form.klient.trim(), adres: form.adres.trim(),
      opisUslugi: form.opisUslugi.trim(), godziny: form.godziny === "" ? null : Number(form.godziny),
      zarobki: form.zarobki === "" ? null : Number(form.zarobki),
      wydatki: form.wydatki === "" ? null : Number(form.wydatki),
      opisWydatkow: form.opisWydatkow.trim(), kategoria: form.kategoria, typKlienta: form.typKlienta,
      status: form.status, uwagi: form.uwagi.trim(),
      statusZlecenia: form.statusZlecenia || defaultOrderStatus(form.data),
      fakturaVat: !!form.fakturaVat, typWpisu: form.typWpisu || "",
    };
    if (formType === "klient") {
      payload.wydatki = null; payload.opisWydatkow = ""; payload.kategoria = ""; payload.typWpisu = "";
    } else if (formType === "zakup") {
      payload.klient = ""; payload.adres = ""; payload.opisUslugi = ""; payload.godziny = null;
      payload.godzinaStart = ""; payload.zarobki = null; payload.typKlienta = ""; payload.status = ""; payload.statusZlecenia = "Wykonane";
      payload.fakturaVat = false; payload.typWpisu = "";
    } else if (formType === "prywatne") {
      payload.klient = ""; payload.opisUslugi = ""; payload.zarobki = null; payload.typKlienta = "";
      payload.status = ""; payload.fakturaVat = false; payload.typWpisu = "prywatne";
      payload.kategoria = "Osobiste";
    }
    return payload;
  }

  function commitPayload(payload) {
    let next;
    if (editingId) {
      next = entries.map((e) => (e.id === editingId ? { ...payload, id: editingId } : e));
    } else {
      const nextId = entries.length ? Math.max(...entries.map((e) => e.id)) + 1 : 1;
      next = [...entries, { ...payload, id: nextId }];
    }
    let nextClients = clients;
    if (payload.klient && payload.klient.trim()) {
      const exists = clients.find((c) => c.name === payload.klient);
      if (exists || form.saveClientToList) {
        nextClients = computeClientsAfterEntry(clients, payload.klient, payload.adres, payload.typKlienta);
      }
    }
    setEntries(next);
    if (nextClients !== clients) setClients(nextClients);
    syncToFirestore(next, freeDays, nextClients);
    setShowForm(false);
  }

  function saveEntry() {
    if (!form.data) return;
    const payload = buildPayload();
    const freeDayHit = (formType === "klient" || formType === "full" || formType === "prywatne") ? freeDays.find((d) => d.date === payload.data) : null;
    if (freeDayHit) {
      setConflictInfo({ payload, type: "freeday", freeDay: freeDayHit });
      return;
    }
    if (payload.godzinaStart) {
      const conflict = findConflict(entries, payload, editingId);
      if (conflict) {
        setConflictInfo({ payload, type: "time", conflict });
        return;
      }
    }
    commitPayload(payload);
  }

  function deleteEntry(id) {
    const next = entries.filter((e) => e.id !== id);
    setEntries(next);
    syncToFirestore(next, freeDays);
  }

  function setEntryStatus(id, status) {

    setEntries(next);
    syncToFirestore(next, freeDays);
  }

  function toggleInvoiceIssued(id) {
    const next = entries.map((e) => (e.id === id ? { ...e, fakturaWystawiona: !e.fakturaWystawiona } : e));
    setEntries(next);
    syncToFirestore(next, freeDays);
  }

  function setPaymentStatus(id, status) {

    setEntries(next);
    syncToFirestore(next, freeDays);
  }

    const next = entries.map((e) => (idSet.has(e.id) ? { ...e, status } : e));
    setEntries(next);

  function openMarkDone(entry) {

        ? {

            zarobki: isPrivate ? e.zarobki : (doneForm.zarobki === "" ? e.zarobki : Number(doneForm.zarobki)),
            wydatki: isPrivate ? (doneForm.wydatki === "" ? e.wydatki : Number(doneForm.wydatki)) : e.wydatki,
            godziny: doneForm.godziny === "" ? e.godziny : Number(doneForm.godziny),
          }
        : e
    );

  function openMove(entry) {
    setMoveInfo({ id: entry.id, klient: entry.klient, opisWydatkow: entry.opisWydatkow, newDate: entry.data, newTime: entry.godzinaStart || "" });
  }

  function performMove(force) {
    if (!moveInfo) return;
    const original = entries.find((e) => e.id === moveInfo.id);
    if (!original) { setMoveInfo(null); return; }
    const payload = { ...original, data: moveInfo.newDate, godzinaStart: moveInfo.newTime };
    if (!force && payload.godzinaStart) {
      const conflict = findConflict(entries, payload, moveInfo.id);
      if (conflict) {
        setMoveConflict({ conflict });
        return;
      }
    }
    const next = entries.map((e) => (e.id === moveInfo.id ? { ...e, data: moveInfo.newDate, godzinaStart: moveInfo.newTime } : e));
    setEntries(next);
    syncToFirestore(next, freeDays);
    setMoveInfo(null);
    setMoveConflict(null);
  }

  function openFreeDayForm(dateStr) {

    setFreeDayForm({ start: dateStr || "", end: dateStr || "", opis: "" });

    setFreeDayConflict(null);
    setShowFreeDayForm(true);
  }

  function saveFreeDays(force) {
    if (!freeDayForm.start) return;
    const start = freeDayForm.start;
    const end = freeDayForm.end || freeDayForm.start;
    const startD = new Date(start + "T00:00:00");
    const endD = new Date(end + "T00:00:00");
    const days = [];
    for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
      const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      days.push(ds);
    }
    if (!force) {
      const dSet = new Set(days);
      const conflicts = entries.filter((e) => e.klient && e.klient.trim() && e.statusZlecenia !== "Odwołane" && dSet.has(e.data));
      if (conflicts.length > 0) {
        setFreeDayConflict({ days, conflicts });
        return;
      }
    }
    commitFreeDays(days);
  }

  function commitFreeDays(days) {
    // Przy edycji istniejącego zakresu najpierw usuwamy jego stare dni, żeby nie zdublować.
    const base = editingFreeDayGroup ? freeDays.filter((f) => !editingFreeDayGroup.ids.includes(f.id)) : freeDays;
    const existing = new Set(base.map((f) => f.date));
    const next = [...base];
    days.forEach((ds) => {
      if (!existing.has(ds)) {
        next.push({ id: Date.now() + Math.random(), date: ds, opis: freeDayForm.opis.trim() });
      }
    });
    setFreeDays(next);
    syncToFirestore(entries, next);
    setShowFreeDayForm(false);
    setFreeDayConflict(null);
    setEditingFreeDayGroup(null);
  }

  function removeFreeDayGroup(ids) {
    const next = freeDays.filter((d) => !ids.includes(d.id));
    setFreeDays(next);
    syncToFirestore(entries, next);
  }

  function openMoveFreeDayGroup(group) {
    setMovingFreeDayGroup(group);
    setMovingFreeDayDate(group.startDate);
  }

  function saveFreeDayMove() {
    if (!movingFreeDayGroup || !movingFreeDayDate) return;
    const oldStart = new Date(movingFreeDayGroup.startDate + "T00:00:00");
    const newStart = new Date(movingFreeDayDate + "T00:00:00");
    const deltaDays = Math.round((newStart - oldStart) / (1000 * 60 * 60 * 24));
    const base = freeDays.filter((d) => !movingFreeDayGroup.ids.includes(d.id));
    const moved = movingFreeDayGroup.ids.map((id) => {
      const orig = freeDays.find((d) => d.id === id);
      const d = new Date(orig.date + "T00:00:00");
      d.setDate(d.getDate() + deltaDays);
      const newDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      return { ...orig, date: newDate };
    });
    const next = [...base, ...moved];
    setFreeDays(next);
    syncToFirestore(entries, next);
    setMovingFreeDayGroup(null);
  }
